<!DOCTYPE html>
<html lang="zh-CN">

  .source-item .src-wave { color: #7e57c2; }
  .source-item .src-wp { color: #26a69a; }

<script type="module">
import * as THREE from 'three';

// ============================================================
// 日志工具
// ============================================================
const logEl = document.getElementById('log');
function log(msg, level = 'info') {
  const line = document.createElement('div');
  line.className = `log-${level}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  while (logEl.children.length > 30) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[${level}] ${msg}`);
}

// ============================================================
// FTX 解析器（移植自 ftxCore.ts）
// ============================================================
const FTX_MAGIC = 0x46545832;
const ADAPTIVE_BLOCK_COLS = 8, ADAPTIVE_BLOCK_ROWS = 8;

function unpackRGB565(packed) {
  return { s: (packed >> 11) & 0x1F, h: (packed >> 5) & 0x3F, l: packed & 0x1F };
}

function invertDelta8(filtered, stride) {
  const out = new Uint8Array(filtered.length);
  for (let i = 0; i < filtered.length; i++) {
    out[i] = (i % stride === 0) ? filtered[i] : (filtered[i] + out[i - 1]) & 0xFF;
  }
  return out;
}

function getAdaptiveBlockIndex(x, y, w, h) {
  const col = Math.min(Math.floor((x / w) * ADAPTIVE_BLOCK_COLS), ADAPTIVE_BLOCK_COLS - 1);
  const row = Math.min(Math.floor((y / h) * ADAPTIVE_BLOCK_ROWS), ADAPTIVE_BLOCK_ROWS - 1);
  return row * ADAPTIVE_BLOCK_COLS + col;
}

function getRangeForBlock(blockFlags, blockIdx) {
  // 统一转为 BigInt 运算，避免 Number 位移溢出
  // （JS 中 1 << n 只取低 5 位，当 blockIdx >= 32 时 1<<32 == 1<<0，导致高索引块误判）
  const flags = typeof blockFlags === 'bigint' ? blockFlags : BigInt(blockFlags);
  return (flags & (1n << BigInt(blockIdx))) ? 0.25 : 0.5;
}

function base64ToUint8(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function decompressFTX(buffer) {
  const dv = new DataView(buffer);
  let off = 0;
  const magic = dv.getUint32(off, false); off += 4;
  if (magic !== FTX_MAGIC) throw new Error('无效的 FTX 文件');
  const version = dv.getUint8(off); off += 1;
  if (version !== 2 && version !== 3) throw new Error(`不支持的版本: ${version}`);
  const regionCount = dv.getUint16(off, true); off += 2;
  const resolution = dv.getUint32(off, true); off += 4;
  const hueThreshold = dv.getFloat32(off, true); off += 4;
  const regions = [];
  for (let i = 0; i < regionCount; i++) {
    const id = dv.getUint16(off, true); off += 2;
    const x = dv.getUint16(off, true); off += 2;
    const y = dv.getUint16(off, true); off += 2;
    const w = dv.getUint16(off, true); off += 2;
    const h = dv.getUint16(off, true); off += 2;
    const bbox = { x, y, w, h };
    const colorCount = dv.getUint16(off, true); off += 2;
    const blockFlags = version === 3 ? dv.getUint16(off, true) : 0;
    off += version === 3 ? 2 : 0;
    const baseColors = [];
    for (let j = 0; j < colorCount; j++) {
      const bh = dv.getFloat32(off, true) + 0.5; off += 4;
      const bs = dv.getFloat32(off, true) + 1.0; off += 4;
      const bl = dv.getFloat32(off, true) + 1.0; off += 4;
      baseColors.push({ h: ((bh % 1) + 1) % 1, s: Math.max(0, Math.min(1, bs)), l: Math.max(0, Math.min(1, bl)) });
    }
    // regionIdTex
    const ridLen = dv.getUint32(off, true); off += 4;
    let regionIdTex = null;
    if (ridLen > 0) {
      const ridDiff = new Uint8Array(buffer, off, ridLen); off += ridLen;
      regionIdTex = invertDelta8(ridDiff, bbox.w);
    }
    // deltaTex
    const dtLen = dv.getUint32(off, true); off += 4;
    let deltaTex = null;
    if (dtLen > 0) {
      const dtBytes = new Uint8Array(buffer, off, dtLen); off += dtLen;
      const total = bbox.w * bbox.h;
      const hDiff = dtBytes.slice(0, total);
      const sDiff = dtBytes.slice(total, total * 2);
      const lDiff = dtBytes.slice(total * 2, total * 3);
      const hCh = invertDelta8(hDiff, bbox.w);
      const sCh = invertDelta8(sDiff, bbox.w);
      const lCh = invertDelta8(lDiff, bbox.w);
      // FTX delta 存储：分离的 H/S/L Uint8 通道（H:0-63, S:0-31, L:0-31）
      deltaTex = { h: hCh, s: sCh, l: lCh };
    }
    regions.push({ id, bbox, baseColors, regionIdTex, deltaTex, blockFlags });
  }
  return { version, resolution: [resolution, resolution], regionCount, regions, hueThreshold };
}

// ============================================================
// Gzip 检测 + 解压（使用浏览器原生 DecompressionStream）
// ============================================================
async function maybeDecompressGzip(arrayBuffer) {
  const u8 = new Uint8Array(arrayBuffer);
  // Gzip 魔数: 0x1f 0x8b
  if (u8.length >= 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
    const blob = new Blob([u8]);
    const stream = blob.stream().pipeThrough(new DecompressionStream('gzip'));
    const decompressed = await new Response(stream).blob();
    return await decompressed.arrayBuffer();
  }
  return arrayBuffer;
}

// ============================================================
// 多帧 FTX3 解析器（移植自 binaryCompression.ts unpackMultiFrameFromBinary）
// Magic: 0x46545833 ("FTX3")
// ============================================================
const FTX3_MAGIC = 0x46545833;

function unpackMultiFrameFTX(buffer) {
  const view = new DataView(buffer);
  let off = 0;

  const magic = view.getUint32(off, false); off += 4;
  if (magic !== FTX3_MAGIC) throw new Error('无效的多帧 FTX3 文件');

  const version = view.getUint8(off); off += 1;
  if (version !== 3) throw new Error(`不支持的多帧版本: ${version}`);

  const predictionFlag = view.getUint8(off); off += 1;
  const enablePrediction = predictionFlag === 1;

  const frameCount = view.getUint16(off, true); off += 2;
  const paletteCount = view.getUint16(off, true); off += 2;

  // 读取全局共享调色板
  const palette = [];
  for (let i = 0; i < paletteCount; i++) {
    palette.push({
      id: i + 1,
      h: view.getFloat32(off, true),
      s: view.getFloat32(off + 4, true),
      l: view.getFloat32(off + 8, true),
    });
    off += 12;
  }

  // 逐帧解析
  const frames = [];
  let prevDecodedRegion = null;

  for (let f = 0; f < frameCount; f++) {
    const nameLen = view.getUint8(off); off += 1;
    const name = new TextDecoder().decode(new Uint8Array(buffer, off, nameLen));
    off += nameLen;

    const width = view.getUint16(off, true); off += 2;
    const height = view.getUint16(off, true); off += 2;
    const bx = view.getUint16(off, true); off += 2;
    const by = view.getUint16(off, true); off += 2;
    const bw = view.getUint16(off, true); off += 2;
    const bh = view.getUint16(off, true); off += 2;
    const bbox = { x: bx, y: by, w: bw, h: bh };

    // ★ 多帧格式 blockFlags 是 64 位（BigUint64），单帧格式是 16 位
    const blockFlags = view.getBigUint64(off, true); off += 8;

    // regionIdTex（含帧间预测编码）
    const ridLen = view.getUint32(off, true); off += 4;
    let regionIdTex = null;
    if (ridLen > 0) {
      const ridDiff = new Uint8Array(buffer, off, ridLen); off += ridLen;
      const processed = invertDelta8(ridDiff, bbox.w);

      // 逆预测编码
      regionIdTex = new Uint8Array(processed.length);
      if (!enablePrediction || prevDecodedRegion === null) {
        for (let i = 0; i < processed.length; i++) {
          const v = processed[i];
          regionIdTex[i] = v === 0 ? 0 : v - 1;
        }
      } else {
        for (let i = 0; i < processed.length; i++) {
          const v = processed[i];
          if (v === 1) {
            regionIdTex[i] = prevDecodedRegion[i];
          } else {
            regionIdTex[i] = v === 0 ? 0 : v - 1;
          }
        }
      }
      prevDecodedRegion = regionIdTex;
    } else {
      regionIdTex = new Uint8Array(0);
    }

    // deltaPacked（分离 H/S/L 通道，差分编码）
    const dtLen = view.getUint32(off, true); off += 4;
    let deltaTex = null;
    if (dtLen > 0) {
      const dtBytes = new Uint8Array(buffer, off, dtLen); off += dtLen;
      const total = bbox.w * bbox.h;
      const hCh = invertDelta8(dtBytes.slice(0, total), bbox.w);
      const sCh = invertDelta8(dtBytes.slice(total, total * 2), bbox.w);
      const lCh = invertDelta8(dtBytes.slice(total * 2, total * 3), bbox.w);
      deltaTex = { h: hCh, s: sCh, l: lCh };
    }

    frames.push({ name, width, height, bbox, blockFlags, regionIdTex, deltaTex });
  }

  return { palette, frames, frameCount, resolution: frames[0]?.width || 512 };
}

// ============================================================
// 统一格式检测 + 解析入口
// ============================================================
async function parseFTXFile(arrayBuffer) {
  // 1. gzip 解压
  const decompressed = await maybeDecompressGzip(arrayBuffer);
  const view = new DataView(decompressed);
  if (decompressed.byteLength < 4) throw new Error('文件过小');
  const magic = view.getUint32(0, false);

  // 2. 根据魔数选择解析器
  if (magic === FTX3_MAGIC) {
    // 多帧 FTX3 格式
    const multiData = unpackMultiFrameFTX(decompressed);
    log(`多帧 FTX3: ${multiData.frameCount} 帧, 调色板 ${multiData.palette.length} 色, 分辨率 ${multiData.resolution}`, 'info');
    return { type: 'multi', data: multiData };
  } else if (magic === FTX_MAGIC) {
    // 单帧 FTX2 格式
    const ftxData = decompressFTX(decompressed);
    log(`单帧 FTX: ${ftxData.regionCount} 区域, 分辨率 ${ftxData.resolution[0]}`, 'info');
    return { type: 'single', data: ftxData };
  } else {
    throw new Error(`未知的文件格式 (Magic: 0x${magic.toString(16).toUpperCase()})`);
  }
}

// ============================================================
// 统一纹理构建（支持单帧和多帧格式）
// ============================================================
function buildTexturesFromAnyFTX(parsedFTX, frameIndex = 0) {
  if (parsedFTX.type === 'single') {
    return buildTexturesFromFTX(parsedFTX.data);
  } else {
    return buildTexturesFromMultiFrame(parsedFTX.data, frameIndex);
  }
}

function buildTexturesFromMultiFrame(multiData, frameIndex) {
  const frame = multiData.frames[frameIndex];
  if (!frame) throw new Error(`帧 ${frameIndex} 不存在`);

  const texSize = multiData.resolution;
  const totalPixels = texSize * texSize;
  const baseHsl = new Float32Array(totalPixels * 4);
  const residual = new Uint8Array(totalPixels * 4);

  const { bbox, regionIdTex, deltaTex, blockFlags } = frame;
  if (!regionIdTex || !deltaTex || bbox.w === 0 || bbox.h === 0) {
    return { baseHsl, residual, texSize };
  }

  // 调色板映射: id → {h, s, l}
  const colorMap = new Map();
  for (const c of multiData.palette) {
    colorMap.set(c.id, c);
  }

  for (let py = 0; py < bbox.h; py++) {
    for (let px = 0; px < bbox.w; px++) {
      const localIdx = py * bbox.w + px;
      const colorId = regionIdTex[localIdx] || 0;
      if (colorId === 0) continue;
      const baseColor = colorMap.get(colorId);
      if (!baseColor) continue;

      const globalX = bbox.x + px;
      const globalY = bbox.y + py;
      const gIdx = (globalY * texSize + globalX) * 4;

      baseHsl[gIdx] = baseColor.h;
      baseHsl[gIdx + 1] = baseColor.s;
      baseHsl[gIdx + 2] = baseColor.l;
      baseHsl[gIdx + 3] = 1.0;

      const qH = deltaTex.h[localIdx];
      const qS = deltaTex.s[localIdx];
      const qL = deltaTex.l[localIdx];

      let rVal = Math.round((qH / 63) * 255);
      let gVal = Math.round((qS / 31) * 255);
      let bVal = Math.round((qL / 31) * 255);

      // blockFlags 调整（64 位，每个 bit 对应一个 8×8 块）
      const blockIdx = getAdaptiveBlockIndex(px, py, bbox.w, bbox.h);
      const range = (blockFlags & (1n << BigInt(blockIdx))) ? 0.25 : 0.5;
      if (range === 0.25) {
        rVal = Math.round(rVal * 0.5 + 64);
        gVal = Math.round(gVal * 0.5 + 64);
        bVal = Math.round(bVal * 0.5 + 64);
      }

      residual[gIdx] = rVal;
      residual[gIdx + 1] = gVal;
      residual[gIdx + 2] = bVal;
      residual[gIdx + 3] = 255;
    }
  }

  return { baseHsl, residual, texSize };
}

// ============================================================
// FTX → GPU 纹理数据转换（单帧格式）
// ============================================================
function buildTexturesFromFTX(ftxData) {
  const texSize = ftxData.resolution[0];
  const totalPixels = texSize * texSize;

  // baseHsl: Float32 RGBA [H, S, L, A]
  const baseHsl = new Float32Array(totalPixels * 4);
  // residual: Uint8 RGBA [qH_norm, qS_norm, qL_norm, 255]
  const residual = new Uint8Array(totalPixels * 4);

  for (const region of ftxData.regions) {
    const { bbox, baseColors, regionIdTex, deltaTex, blockFlags } = region;
    if (!regionIdTex || !deltaTex || bbox.w === 0 || bbox.h === 0) continue;

    // 构建调色板映射: regionIdTex 值 → baseColor 索引
    // baseColors 数组的索引就是 regionIdTex 中的值（从 1 开始）
    const colorMap = new Map();
    baseColors.forEach((c, idx) => colorMap.set(idx + 1, c));

    for (let py = 0; py < bbox.h; py++) {
      for (let px = 0; px < bbox.w; px++) {
        const localIdx = py * bbox.w + px;
        const colorId = regionIdTex[localIdx] || 0;
        if (colorId === 0) continue;
        const baseColor = colorMap.get(colorId);
        if (!baseColor) continue;

        const globalX = bbox.x + px;
        const globalY = bbox.y + py;
        const gIdx = (globalY * texSize + globalX) * 4;

        // baseHsl: 直接存浮点 HSL
        baseHsl[gIdx] = baseColor.h;
        baseHsl[gIdx + 1] = baseColor.s;
        baseHsl[gIdx + 2] = baseColor.l;
        baseHsl[gIdx + 3] = 1.0;

        // residual: 从分离的 H/S/L 通道读取量化值
        const qH = deltaTex.h[localIdx]; // 0-63 (6 bit)
        const qS = deltaTex.s[localIdx]; // 0-31 (5 bit)
        const qL = deltaTex.l[localIdx]; // 0-31 (5 bit)

        // 归一化到 0-255
        let rVal = Math.round((qH / 63) * 255);
        let gVal = Math.round((qS / 31) * 255);
        let bVal = Math.round((qL / 31) * 255);

        // ★ blockFlags 调整：range=0.25 的块需要重映射到 0.5 范围
        // 公式: val' = val * 0.5 + 64 (255*0.25 ≈ 64)
        const blockIdx = getAdaptiveBlockIndex(px, py, bbox.w, bbox.h);
        const range = getRangeForBlock(blockFlags, blockIdx);
        if (range === 0.25) {
          rVal = Math.round(rVal * 0.5 + 64);
          gVal = Math.round(gVal * 0.5 + 64);
          bVal = Math.round(bVal * 0.5 + 64);
        }

        residual[gIdx] = rVal;
        residual[gIdx + 1] = gVal;
        residual[gIdx + 2] = bVal;
        residual[gIdx + 3] = 255;
      }
    }
  }

  return { baseHsl, residual, texSize };
}

// ============================================================
// FluidGrid — 双缓冲纹理管理（速度场强制 half-float）
// ============================================================
class FluidGrid {
  constructor(resolution, channels, dataType) {
    this.resolution = { w: resolution.w, h: resolution.h };
    this.channelCount = channels;
    this.dataType = dataType;
    const formatMap = { 1: THREE.RedFormat, 2: THREE.RGFormat, 3: THREE.RGBAFormat, 4: THREE.RGBAFormat };
    const typeMap = { 'uint8': THREE.UnsignedByteType, 'half-float': THREE.HalfFloatType, 'float': THREE.FloatType };
    const opts = {
      format: formatMap[channels],
      type: typeMap[dataType],
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
      depthBuffer: false, stencilBuffer: false,
    };
    this.texA = new THREE.WebGLRenderTarget(resolution.w, resolution.h, opts);
    this.texB = new THREE.WebGLRenderTarget(resolution.w, resolution.h, opts);
    this.current = 'A';
  }
  get read() { return (this.current === 'A' ? this.texA : this.texB).texture; }
  get readTarget() { return this.current === 'A' ? this.texA : this.texB; }
  get write() { return this.current === 'A' ? this.texB : this.texA; }
  swap() { this.current = this.current === 'A' ? 'B' : 'A'; }
  dispose() { this.texA.dispose(); this.texB.dispose(); }
}

// ============================================================
// GPUOps — 全屏四边形渲染 + 材质缓存
// ============================================================
class GPUOps {
  constructor() {
    this.materialCache = new Map();
    // ★ 与编辑器 GPUOps.ts 一致：复用 scene/camera/quad，避免每帧创建
    //   PlaneGeometry 导致 GPU 内存泄漏
    this.scene = new THREE.Scene();
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    this.scene.add(this.quad);
  }
  getMaterial(key, uniforms, fragmentShader) {
    if (this.materialCache.has(key)) {
      const mat = this.materialCache.get(key);
      // 更新 uniforms（保留纹理引用）
      for (const u in uniforms) {
        if (mat.uniforms[u]) mat.uniforms[u].value = uniforms[u].value;
      }
      return mat;
    }
    // ★ 与编辑器 GPUOps.ts 一致：GPU Pass 使用 vUv=uv（不翻转 Y）
    //   仅合成/预览着色器才 Y-flip（用于屏幕显示校正）。
    //   若 GPU Pass 也 Y-flip，render target 会与 DataTexture（flipY=false）
    //   产生纵向错位：baseHslTex 顶部对应 colorGrid 底部 → 合成出现噪点/错位。
    //   且平流 backUv=uv-vel*dt/res 的 Y 方向会被反转（重力倒流）。
    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader,
    });
    this.materialCache.set(key, mat);
    return mat;
  }
  render(renderer, target, material) {
    // ★ 与编辑器 GPUOps.ts 一致：复用 quad，clear 后渲染
    const prevMat = this.quad.material;
    this.quad.material = material;
    const prev = renderer.getRenderTarget();
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(this.scene, this.camera);
    renderer.setRenderTarget(prev);
    this.quad.material = prevMat;
  }
}

// ============================================================
// 零障碍物纹理（1×1，R=0）
// ============================================================
let _zeroObstacleTex = null;
function getZeroObstacleTex() {
  if (_zeroObstacleTex) return _zeroObstacleTex;
  const data = new Uint8Array([0]);
  _zeroObstacleTex = new THREE.DataTexture(data, 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
  _zeroObstacleTex.needsUpdate = true;
  _zeroObstacleTex.minFilter = THREE.NearestFilter;
  _zeroObstacleTex.magFilter = THREE.NearestFilter;
  return _zeroObstacleTex;
}

// ============================================================
// 流体播放器主类
// ============================================================
class FluidPlayer {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
    this.renderer.setPixelRatio(1);
    this.gpu = new GPUOps();
    this.config = null;
    this.ftxData = null;
    this.texSize = 512;
    this.colorGrid = null;
    this.velocityGrid = null;
    this.pressureGrid = null;
    this.densityGrid = null;
    this.obstacleTex = null;
    this.baseHslTex = null;
    this.time = 0;
    this.frameCount = 0;
    this.waypointStates = new Map();
    this.continuousSources = [];
    this.manualInjection = null;
  }

  // ---------- 加载 FTX（支持单帧 FTX2 / 多帧 FTX3 / gzip 压缩）----------
  async loadFTX(arrayBuffer) {
    this.parsedFTX = await parseFTXFile(arrayBuffer);

    // 提取分辨率
    if (this.parsedFTX.type === 'single') {
      this.texSize = this.parsedFTX.data.resolution[0];
    } else {
      this.texSize = this.parsedFTX.data.resolution;
    }

    // ★ 调整 canvas 绘图缓冲区为纹理原生分辨率（CSS 显示尺寸不变）
    this.resizeCanvas();

    // ★ 清理上一个 FTX 的预览残差纹理（避免残留数据）
    if (this._previewResidualTex) {
      this._previewResidualTex.dispose();
      this._previewResidualTex = null;
    }

    // 构建第 0 帧纹理
    this.currentFrameIndex = 0;
    this._buildTexturesForFrame(0);

    // ★ 如果配置已加载，同步更新 colorGrid + 重置场数据（避免残留上一个纹理的残差）
    if (this.config) {
      this.config.resolution = { w: this.texSize, h: this.texSize };
      this.rebuildGrids();
      if (this._pendingResidual) {
        this.uploadToColorGrid(this._pendingResidual);
        this._pendingResidual = null;
      }
      this.initFields();
    }

    // 如果是多帧，填充帧选择器
    if (this.parsedFTX.type === 'multi' && this.parsedFTX.data.frameCount > 1) {
      this._populateFrameSelector();
    } else {
      document.getElementById('panel-frames').style.display = 'none';
    }

    // ★ 立即显示 FTX 纹理合成预览（无需等待 JSON 配置导入）
    this.render();
  }

  _buildTexturesForFrame(frameIndex) {
    const { baseHsl, residual, texSize } = buildTexturesFromAnyFTX(this.parsedFTX, frameIndex);
    this.texSize = texSize;

    // 创建 baseHsl 纹理（Float32 RGBA）
    if (this.baseHslTex) this.baseHslTex.dispose();
    this.baseHslTex = new THREE.DataTexture(
      baseHsl, texSize, texSize, THREE.RGBAFormat, THREE.FloatType
    );
    this.baseHslTex.needsUpdate = true;
    this.baseHslTex.minFilter = THREE.LinearFilter;
    this.baseHslTex.magFilter = THREE.LinearFilter;
    this.baseHslTex.flipY = false;

    // 存储 residual 数据供 JSON 加载后上传
    this._pendingResidual = residual;
    this.currentFrameIndex = frameIndex;
  }

  _populateFrameSelector() {
    const panel = document.getElementById('panel-frames');
    const select = document.getElementById('ctrl-frame');
    const countEl = document.getElementById('info-frame-count');
    const frames = this.parsedFTX.data.frames;
    countEl.textContent = frames.length;
    select.innerHTML = '';
    frames.forEach((f, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${i}: ${f.name || 'frame_' + i} (${f.bbox.w}×${f.bbox.h})`;
      select.appendChild(opt);
    });
    panel.style.display = 'block';
  }

  switchFrame(frameIndex) {
    if (!this.parsedFTX || this.parsedFTX.type !== 'multi') return;
    this._buildTexturesForFrame(frameIndex);
    // ★ 帧间分辨率可能不同，同步 canvas 绘图缓冲区
    this.resizeCanvas();
    log(`切换到帧 ${frameIndex}`, 'info');

    // 如果配置已加载，重新上传 residual 并重置场
    if (this.config) {
      this.config.resolution = { w: this.texSize, h: this.texSize };
      this.rebuildGrids();
      if (this._pendingResidual) {
        this.uploadToColorGrid(this._pendingResidual);
        this._pendingResidual = null;
      }
      this.initFields();
      this.render();
    } else {
      // 无 config 时显示预览合成视图
      this.render();
    }
  }

  // ---------- 加载 JSON 配置 ----------
  loadConfig(json) {
    // ★ 检查 FTX 是否已导入
    if (!this.texSize || !this.baseHslTex) {
      log('错误: 请先导入 FTX 纹理数据！', 'error');
      return;
    }

    log('='.repeat(50), 'info');
    log(`【loadConfig 开始】导入物理场数据后对纹理的完整操作流程：`, 'info');

    this.config = this.parseConfig(json);
    const cfg = this.config;
    const _isScalar = cfg.advectionMode === 'scalar';
    log(`① 配置解析完成: mode=${cfg.advectionMode}(${_isScalar?'标量浓度':'矢量颜色'}) combine=${cfg.combineMode}`, 'info');

    // 以 FTX 分辨率为准（FTX 是纹理数据源）
    const _oldRes = json.resolution || '?';
    cfg.resolution = { w: this.texSize, h: this.texSize };
    log(`② 分辨率锁定: JSON=${JSON.stringify(_oldRes)} → FTX=${this.texSize}×${this.texSize} (强制覆盖)`, 'info');

    // 重建 Grid
    log(`③ 重建 4 个双缓冲场纹理（WebGLRenderTarget）：`, 'info');
    this.rebuildGrids();
    const _cCh = ['r','g','b','a'].filter(k => cfg.channels[k]).length;
    log(`   colorGrid: ${cfg.resolution.w}×${cfg.resolution.h}, ${_cCh}ch uint8 (存储${_isScalar?'静态残差模板':'量化HSLA残差'})`, 'info');
    log(`   velocityGrid: ${cfg.resolution.w}×${cfg.resolution.h}, 2ch half-float (存储速度vx,vy)`, 'info');
    log(`   pressureGrid: ${cfg.resolution.w}×${cfg.resolution.h}, 1ch half-float (存储压力)`, 'info');
    log(`   densityGrid:  ${cfg.resolution.w}×${cfg.resolution.h}, 1ch uint8 (存储浓度${_isScalar?'（标量模式核心动态场）':'（备用）'})`, 'info');
    log(`   colorGrid 纹理过滤: NearestFilter ✅（防止量化残差插值噪点）`, 'info');

    // 上传 residual
    if (this._pendingResidual) {
      const _n = cfg.resolution.w * cfg.resolution.h;
      const _r = this._pendingResidual;
      // 采样几个像素看残差数值范围
      let _rmax=0, _rmin=255, _smax=0, _smin=255, _lmax=0, _lmin=255;
      for (let _i=0; _i<Math.min(_n, 100000); _i++) {
        const _j = _i*4;
        if (_r[_j]>_rmax)_rmax=_r[_j]; if (_r[_j]<_rmin)_rmin=_r[_j];
        if (_r[_j+1]>_smax)_smax=_r[_j+1]; if (_r[_j+1]<_smin)_smin=_r[_j+1];
        if (_r[_j+2]>_lmax)_lmax=_r[_j+2]; if (_r[_j+2]<_lmin)_lmin=_r[_j+2];
      }
      log(`④ 上传 FTX 残差 → colorGrid: ${this._pendingResidual.length} 字节 (${_n}像素×4ch)`, 'info');
      log(`   残差采样范围[0~10万像素]: R(H)=${_rmin}~${_rmax} G(S)=${_smin}~${_smax} B(L)=${_lmin}~${_lmax}`, 'info');
      log(`   (正确范围: R=0~255 对应 6bit 量化 H 映射到 0.5 范围, G/B=0~255 对应 5bit 量化 S/L)`, 'info');
      log(`   使用 NearestFilter copy shader → colorGrid.write → swap → colorGrid.read`, 'info');
      this.uploadToColorGrid(this._pendingResidual);
      this._pendingResidual = null;
      log(`   ✅ colorGrid.read 现在持有 FTX 残差原始量化值`, 'info');
    } else {
      log('④ ⚠ 警告: 没有待上传的残差数据！colorGrid 初始化时可能全 0 → 合成时 base+0 = 纯基础色', 'warn');
    }

    // 障碍物
    if (json.obstacle && json.obstacle.data) {
      log(`⑤ 加载障碍物纹理: ${json.obstacle.width}×${json.obstacle.height}, base64 ${Math.round(json.obstacle.data.length/1024)}KB`, 'info');
      this.loadObstacle(json.obstacle);
    } else {
      log(`⑤ 无障碍物纹理：全部注入/平流不受墙体阻挡`, 'info');
    }

    // 加载持续注入源
    const _srcs = cfg.continuousSources;
    const _densityFallback = _isScalar ? 1.0 : undefined;
    this.continuousSources = _srcs.map(s => ({
      id: this.continuousSources.length,
      config: { ...s, density: s.density ?? _densityFallback },
    }));
    log(`⑥ 加载 ${_srcs.length} 个持续注入源${_isScalar?' (scalar模式: 仅注入速度 + 密度, 不注入颜色!)':''}：`, 'info');
    if (_isScalar) {
      log(`   ★ scalar 模式关键语义: colorGrid = 静态残差模板（不平流、不注入！）`, 'info');
      log(`   ★ 只平流 + 注入 densityGrid + velocityGrid（通过 density/baseline × mul 调制颜色）`, 'info');
    }
    for (let i = 0; i < Math.min(_srcs.length, 3); i++) {
      const s = this.continuousSources[i].config;
      log(`   src#${i}: enabled=${s.enabled} pos=(${s.position.x.toFixed(2)},${s.position.y.toFixed(2)}) r=${s.radius} |v|=${Math.hypot(s.velocity.x,s.velocity.y).toFixed(0)} ${s.density!==undefined?'density='+s.density.toFixed(2):''} ${s.wave?.enabled?'[wave]':''} ${s.waypoints?.length>=2?'[wp='+s.waypoints.length+']':''}`, 'info');
    }

    // 初始化场
    log(`⑦ initFields()：`, 'info');
    log(`   velocityGrid → 全 0 清零 (shader 输出 vec4(0.0)，无 DataTexture 类型不匹配问题)`, 'info');
    log(`   densityGrid  → 全 0 清零`, 'info');
    log(`   colorGrid    → ⚠ 不清零！保留 FTX 上传的残差作为${_isScalar?'静态模板':'动态平流源'} ✅`, 'info');
    this.initFields();

    // 渲染 UI
    this.renderSourceList();

    // 立即渲染第一帧合成视图
    log(`⑧ 首次合成渲染 render()：baseHslTex(FloatType HSL) + colorGrid(Uint8 量化残差) → HSL→RGB → canvas`, 'info');
    log(`   scalar 模式合成公式: final = base + (残差反量化 delta) + sign×(density/baseline × mul)`, 'info');
    log(`   vector 模式合成公式: final = base + (残差反量化 delta)`, 'info');
    log(`  (注意: densityGrid 此刻全 0 → scalar 模式下 density×mul 项=0 → 画面 = base + delta = 与 renderPreview 视觉一致)`, 'info');
    this.render();

    log(`【loadConfig 完成 ✅】播放时每帧 step 流程: 注入 → 平流 → 压力 → 合成渲染`, 'info');
    log('='.repeat(50), 'info');
  }

  parseConfig(json) {
    const cs = json.coreSwitches || {};
    const ac = json.advectionAndComposite || {};
    const gf = json.globalForce || {};
    // ★ JSON 导出格式：ac.channels = { h, s, l, a }（编辑器物理 RGBA → 逻辑 HSLA）
    //   内部格式：config.channels = { r:H, g:S, b:L, a:A }（保持一致）
    const _ch = ac.channels || { h: true, s: true, l: true, a: true };
    // 兼容两种格式：如果 JSON 中直接是 {r,g,b,a} 则直接使用
    const channels = (_ch.r !== undefined)
      ? { r: !!_ch.r, g: !!_ch.g, b: !!_ch.b, a: !!_ch.a }
      : { r: !!_ch.h, g: !!_ch.s, b: !!_ch.l, a: !!_ch.a };

    // ★ scalarConfig 默认值需与编辑器完全一致（useFluidEditor.ts L43-50）
    //   编辑器默认: hMul/sMul/lMul/aMul=0.1, baseline=1.0, decay=0
    const sc = ac.scalarConfig || {};
    const scalarConfig = {
      hMultiplier: sc.hMultiplier ?? 0.1,
      sMultiplier: sc.sMultiplier ?? 0.1,
      lMultiplier: sc.lMultiplier ?? 0.1,
      aMultiplier: sc.aMultiplier ?? 0.1,
      baselineDensity: sc.baselineDensity ?? 1.0,
      decayRate: sc.decayRate ?? 0,
    };

    const result = {
      enableAdvection: cs.enableAdvection ?? true,
      enablePressure: cs.enablePressure ?? true,
      pressureIterations: cs.pressureIterations ?? 20,
      pressureOmega: cs.pressureOmega ?? 1.7,
      pressureBoundaryMode: cs.pressureBoundaryMode ?? 'dirichlet',
      enableWarmStart: cs.enableWarmStart ?? true,
      advectionMode: ac.advectionMode || 'vector',
      combineMode: ac.combineMode || 'add',
      channels,
      scalarConfig,
      gravity: gf.gravity || { x: 0, y: 0 },
      velocityScale: gf.velocityScale ?? 1,
      maxVelocity: gf.maxVelocity ?? 5000,
      colorBoundaryMode: gf.colorBoundaryMode || 'clamp',
      resolution: json.resolution ? (typeof json.resolution === 'number' ? { w: json.resolution, h: json.resolution } : json.resolution) : { w: this.texSize, h: this.texSize },
      continuousSources: json.continuousSources || [],
    };

    // ============ 详细调试输出 ============
    const _d = (v) => typeof v === 'number' ? v.toFixed(3) : JSON.stringify(v);
    log(`【解析配置 Debug】`, 'info');
    log(`  advectionMode=${result.advectionMode} (0=vector, 1=scalar)`, 'info');
    log(`  combineMode=${result.combineMode}`, 'info');
    log(`  channels: H=${result.channels.r} S=${result.channels.g} L=${result.channels.b} A=${result.channels.a}`, 'info');
    log(`  scalarConfig: hMul=${_d(scalarConfig.hMultiplier)} sMul=${_d(scalarConfig.sMultiplier)} lMul=${_d(scalarConfig.lMultiplier)} aMul=${_d(scalarConfig.aMultiplier)} baseline=${_d(scalarConfig.baselineDensity)} decay=${_d(scalarConfig.decayRate)}`, 'info');
    log(`  物理开关: adv=${result.enableAdvection} pressure=${result.enablePressure} warm=${result.enableWarmStart}`, 'info');
    log(`  压力: iter=${result.pressureIterations} omega=${_d(result.pressureOmega)} boundary=${result.pressureBoundaryMode}`, 'info');
    log(`  全局力: gravity=(${_d(result.gravity.x)},${_d(result.gravity.y)}) velScale=${_d(result.velocityScale)} maxVel=${result.maxVelocity}`, 'info');
    log(`  持续注入源: ${result.continuousSources.length} 个`, 'info');
    for (let i = 0; i < Math.min(result.continuousSources.length, 3); i++) {
      const s = result.continuousSources[i];
      log(`    src[${i}] enabled=${s.enabled} pos=(${s.position.x.toFixed(2)},${s.position.y.toFixed(2)}) vel=(${s.velocity.x.toFixed(0)},${s.velocity.y.toFixed(0)}) dens=${s.density ?? 'N/A'}`, 'info');
    }
    log(`【解析配置 End】`, 'info');

    return result;
  }

  rebuildGrids() {
    const res = this.config.resolution;
    this.colorGrid?.dispose();
    this.velocityGrid?.dispose();
    this.pressureGrid?.dispose();
    this.densityGrid?.dispose();
    // ★ colorGrid 固定 4 通道 RGBA uint8：
    //   FTX 残差数据总是 RGBA（H/S/L/A 四通道量化值），
    //   channels 配置只影响平流 mask 和合成着色器通道开关，不影响存储格式。
    //   如果按 channels 减少通道数（如只开 H → 1ch RedFormat），
    //   uploadToColorGrid 的 RGBA 数据写入 RedFormat target 时 GBA 丢失 →
    //   合成着色器采样 .gba=0 → dS/dL=-0.5 → 严重色偏噪点。
    this.colorGrid = new FluidGrid(res, 4, 'uint8');
    // ★ colorGrid 存储量化残差值（H:0-63, S/L:0-31 编码在 0-255），
    //   LinearFilter 插值会产生无意义中间值 → 噪点
    //   必须用 NearestFilter 确保精确采样
    [this.colorGrid.texA.texture, this.colorGrid.texB.texture].forEach(t => {
      t.minFilter = THREE.NearestFilter;
      t.magFilter = THREE.NearestFilter;
    });
    // 速度场/压力场 half-float（2字节/通道，精度足够且省显存）
    this.velocityGrid = new FluidGrid(res, 2, 'half-float');
    this.pressureGrid = new FluidGrid(res, 1, 'half-float');
    this.densityGrid = new FluidGrid(res, 1, 'uint8');
  }

  uploadToColorGrid(data) {
    const { w, h } = this.config.resolution;
    // ★ 依照编辑器 uploadToGrid 方式：根据数据通道数选择 DataTexture format + copy shader
    //   FTX 残差数据总是 RGBA 4 通道（buildTexturesFromFTX 生成），
    //   colorGrid 也固定 4 通道 RGBA → 格式完全匹配，不会丢通道
    const dataChannels = 4;
    const formatMap = { 1: THREE.RedFormat, 2: THREE.RGFormat, 3: THREE.RGBAFormat, 4: THREE.RGBAFormat };
    const tex = new THREE.DataTexture(data, w, h, formatMap[dataChannels], THREE.UnsignedByteType);
    tex.needsUpdate = true;
    tex.flipY = false;
    // ★ 残差是量化值，用 NearestFilter 避免复制时插值产生噪点
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    // ★ 根据数据通道数选择 copy shader（与编辑器 getCopyFS 一致）
    const copyFS = dataChannels === 1
      ? `uniform sampler2D uTex; varying vec2 vUv; void main(){ float v=texture2D(uTex,vUv).r; gl_FragColor=vec4(v,0.0,0.0,1.0); }`
      : dataChannels === 2
      ? `uniform sampler2D uTex; varying vec2 vUv; void main(){ vec2 v=texture2D(uTex,vUv).rg; gl_FragColor=vec4(v,0.0,1.0); }`
      : `uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(uTex,vUv); }`;
    // ★ 与编辑器 uploadToGrid 一致：copy pass 使用 vUv=uv（不翻转 Y）
    //   这样 colorGrid（render target）与 baseHslTex（DataTexture flipY=false）
    //   在 UV 空间方向一致，合成时不会纵向错位。
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: tex } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: copyFS,
    });
    this.gpu.render(this.renderer, this.colorGrid.write, mat);
    this.colorGrid.swap();
    tex.dispose();
  }

  loadObstacle(obstacleData) {
    const { width, height, data } = obstacleData;
    const bytes = base64ToUint8(data);
    // data 是 1-bit/pixel 位图，展开为 1-byte/pixel (0 或 255)
    const expanded = new Uint8Array(width * height);
    for (let i = 0; i < width * height; i++) {
      const byteIdx = i >> 3;
      const bitIdx = 7 - (i & 7);
      expanded[i] = (bytes[byteIdx] & (1 << bitIdx)) ? 255 : 0;
    }
    if (this.obstacleTex) this.obstacleTex.dispose();
    this.obstacleTex = new THREE.DataTexture(expanded, width, height, THREE.RedFormat, THREE.UnsignedByteType);
    this.obstacleTex.needsUpdate = true;
    this.obstacleTex.minFilter = THREE.NearestFilter;
    this.obstacleTex.magFilter = THREE.NearestFilter;
    this.obstacleTex.flipY = false;
    log(`墙体加载: ${width}×${height}, ${(expanded.filter(v => v > 0).length / expanded.length * 100).toFixed(1)}% 填充`, 'info');
  }

  getObstacleTex() { return this.obstacleTex || getZeroObstacleTex(); }

  // ---------- 初始化场 ----------
  initFields() {
    // colorGrid 已经由 FTX residual 上传，不重置
    // 速度场清零
    this.clearGrid(this.velocityGrid);
    // density 场清零
    this.clearGrid(this.densityGrid);
  }

  // ★ 使用 renderer.clear() 直接清空渲染目标，比 shader 输出 vec4(0.0) 更可靠
  //   对于 RedFormat 单通道密度场，shader 输出的 R 通道可能未被完全覆盖
  //   （某些 WebGL 实现对单通道渲染目标有特殊限制），
  //   renderer.clear() 直接操作 framebuffer，确保所有通道被清零
  clearGrid(grid) {
    const prev = this.renderer.getRenderTarget();
    this.renderer.setRenderTarget(grid.write);
    this.renderer.clear(true, true, true);  // clear color + depth + stencil
    this.renderer.setRenderTarget(prev);
    grid.swap();
  }

  // ---------- 平流 ----------
  advect(grid, velocityTex, dt, mask, boundaryMode, wrapHue) {
    const subSteps = this.computeSubSteps(dt);
    const subDt = dt / subSteps;
    const maskVec = new THREE.Vector4(mask.r?1:0, mask.g?1:0, mask.b?1:0, mask.a?1:0);

    let boundaryFn = 'backUv = clamp(backUv, vec2(0.0), vec2(1.0));';
    if (boundaryMode === 'repeat') boundaryFn = 'backUv = fract(backUv);';
    else if (boundaryMode === 'zero') {
      boundaryFn = `bool _oob; _oob = any(lessThan(backUv, vec2(0.0))) || any(greaterThan(backUv, vec2(1.0))); if(_oob){ gl_FragColor=vec4(0.0); return; }`;
    }
    const hueWrap = wrapHue && mask.r ? 'result.r = fract(result.r + 1.0);' : '';

    const key = `advect_${mask.r?'1':'0'}${mask.g?'1':'0'}${mask.b?'1':'0'}${mask.a?'1':'0'}_${boundaryMode}_${wrapHue?'1':'0'}`;
    const mat = this.gpu.getMaterial(key, {
      uInput: { value: grid.read },
      uVelocity: { value: velocityTex },
      uObstacle: { value: this.getObstacleTex() },
      uDt: { value: subDt },
      uResolution: { value: new THREE.Vector2(grid.resolution.w, grid.resolution.h) },
      uMask: { value: maskVec },
    }, `
      uniform sampler2D uInput;
      uniform sampler2D uVelocity;
      uniform sampler2D uObstacle;
      uniform float uDt;
      uniform vec2 uResolution;
      uniform vec4 uMask;
      varying vec2 vUv;
      void main(){
        vec2 uv = vUv;
        vec2 vel = texture2D(uVelocity, uv).rg;
        vec2 backUv = uv - vel * uDt / uResolution;
        ${boundaryFn}
        vec4 staticVal = texture2D(uInput, uv);
        vec4 flowVal;
        if (texture2D(uObstacle, backUv).r > 0.5) {
          flowVal = staticVal;
        } else {
          flowVal = texture2D(uInput, backUv);
        }
        vec4 result;
        result.r = mix(staticVal.r, flowVal.r, uMask.r);
        result.g = mix(staticVal.g, flowVal.g, uMask.g);
        result.b = mix(staticVal.b, flowVal.b, uMask.b);
        result.a = mix(staticVal.a, flowVal.a, uMask.a);
        ${hueWrap}
        gl_FragColor = result;
      }
    `);

    for (let s = 0; s < subSteps; s++) {
      mat.uniforms.uInput.value = grid.read;
      mat.uniforms.uDt.value = subDt;
      this.gpu.render(this.renderer, grid.write, mat);
      grid.swap();
    }
  }

  computeSubSteps(dt) {
    const maxVel = this.config.maxVelocity || 5000;
    const minGrid = Math.min(this.config.resolution.w, this.config.resolution.h);
    const cfl = Math.ceil((maxVel * dt) / minGrid);
    const g = this.config.gravity;
    const gMag = Math.sqrt(g.x * g.x + g.y * g.y);
    const gSub = Math.ceil(gMag * dt / 50);
    return Math.max(1, Math.max(cfl, gSub));
  }

  // ---------- 注入 ----------
  injectColor(grid, color, rate, pos, channelMask) {
    const mat = this.gpu.getMaterial('inj_color', {
      uColor: { value: grid.read },
      uTargetColor: { value: new THREE.Vector4(color.h, color.s, color.l, color.a) },
      uRate: { value: rate },
      uPos: { value: new THREE.Vector2(pos.position.x, pos.position.y) },
      uRadius: { value: pos.radius },
      uGlobal: { value: pos.global ? 1 : 0 },
      uChannelMask: { value: new THREE.Vector4(channelMask.r?1:0, channelMask.g?1:0, channelMask.b?1:0, channelMask.a?1:0) },
      uObstacle: { value: pos.obstacle || this.getObstacleTex() },
    }, `
      uniform sampler2D uColor;
      uniform vec4 uTargetColor;
      uniform float uRate;
      uniform vec2 uPos;
      uniform float uRadius;
      uniform int uGlobal;
      uniform vec4 uChannelMask;
      uniform sampler2D uObstacle;
      varying vec2 vUv;
      float hueLerp(float a, float b, float t) {
        float d = b - a;
        if (d > 0.5) d -= 1.0;
        if (d < -0.5) d += 1.0;
        return fract(a + d * t);
      }
      void main() {
        if (texture2D(uObstacle, vUv).r > 0.5) { gl_FragColor = texture2D(uColor, vUv); return; }
        float maskVal = 1.0;
        if (uGlobal == 0) {
          float d = distance(vUv, uPos);
          maskVal = smoothstep(uRadius, 0.0, d);
        }
        vec4 current = texture2D(uColor, vUv);
        float rate = uRate * maskVal;
        vec4 mixed;
        mixed.r = hueLerp(current.r, uTargetColor.r, rate);
        mixed.g = mix(current.g, uTargetColor.g, rate);
        mixed.b = mix(current.b, uTargetColor.b, rate);
        mixed.a = mix(current.a, uTargetColor.a, rate);
        gl_FragColor = vec4(
          mix(current.r, mixed.r, uChannelMask.r),
          mix(current.g, mixed.g, uChannelMask.g),
          mix(current.b, mixed.b, uChannelMask.b),
          mix(current.a, mixed.a, uChannelMask.a)
        );
      }
    `);
    this.gpu.render(this.renderer, grid.write, mat);
    grid.swap();
  }

  injectVelocity(grid, velocity, pos) {
    const mat = this.gpu.getMaterial('inj_vel', {
      uVelocity: { value: grid.read },
      uVel: { value: new THREE.Vector2(velocity.x, velocity.y) },
      uPos: { value: new THREE.Vector2(pos.position.x, pos.position.y) },
      uRadius: { value: pos.radius },
      uGlobal: { value: pos.global ? 1 : 0 },
      uObstacle: { value: pos.obstacle || this.getObstacleTex() },
    }, `
      uniform sampler2D uVelocity;
      uniform vec2 uVel;
      uniform vec2 uPos;
      uniform float uRadius;
      uniform int uGlobal;
      uniform sampler2D uObstacle;
      varying vec2 vUv;
      void main() {
        if (texture2D(uObstacle, vUv).r > 0.5) { gl_FragColor = texture2D(uVelocity, vUv); return; }
        float maskVal = 1.0;
        if (uGlobal == 0) {
          float d = distance(vUv, uPos);
          maskVal = smoothstep(uRadius, 0.0, d);
        }
        vec2 current = texture2D(uVelocity, vUv).rg;
        vec2 added = uVel * maskVal;
        gl_FragColor = vec4(current + added, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, grid.write, mat);
    grid.swap();
  }

  injectDensity(grid, value, rate, pos) {
    const mat = this.gpu.getMaterial('inj_density', {
      uDensity: { value: grid.read },
      uValue: { value: value },
      uRate: { value: rate },
      uPos: { value: new THREE.Vector2(pos.position.x, pos.position.y) },
      uRadius: { value: pos.radius },
      uGlobal: { value: pos.global ? 1 : 0 },
      uObstacle: { value: pos.obstacle || this.getObstacleTex() },
    }, `
      uniform sampler2D uDensity;
      uniform float uValue;
      uniform float uRate;
      uniform vec2 uPos;
      uniform float uRadius;
      uniform int uGlobal;
      uniform sampler2D uObstacle;
      varying vec2 vUv;
      void main() {
        if (texture2D(uObstacle, vUv).r > 0.5) { gl_FragColor = texture2D(uDensity, vUv); return; }
        float maskVal = 1.0;
        if (uGlobal == 0) {
          float d = distance(vUv, uPos);
          maskVal = smoothstep(uRadius, 0.0, d);
        }
        float current = texture2D(uDensity, vUv).r;
        float mixed = mix(current, uValue, uRate * maskVal);
        gl_FragColor = vec4(mixed, 0.0, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, grid.write, mat);
    grid.swap();
  }

  // ---------- 重力 ----------
  applyGravity(dt) {
    const g = this.config.gravity;
    if (g.x === 0 && g.y === 0) return;
    this.injectVelocity(this.velocityGrid, { x: g.x * dt, y: g.y * dt }, { global: true });
  }

  // ---------- 持续注入源处理 ----------
  processContinuousSources(dt) {
    if (this.continuousSources.length === 0) return;
    const isScalar = this.config.advectionMode === 'scalar';
    const ch = this.config.channels;

    for (const src of this.continuousSources) {
      if (!src.config.enabled) continue;
      let config = { ...src.config };

      // 路径点插值
      const wps = config.waypoints;
      if (wps && wps.length >= 2) {
        const mode = config.waypointMode || 'forward';
        const speed = config.waypointSpeed ?? 1.0;
        const total = wps.length;
        let state = this.waypointStates.get(src.id);
        if (!state || state.lastWaypointCount !== total) {
          const startPos = mode === 'backward' ? wps[total - 1] : wps[0];
          state = { logicalStep: 0, progress: 0, currentPosition: { ...startPos }, lastWaypointCount: total };
          this.waypointStates.set(src.id, state);
        }
        state.progress += dt * speed;
        while (state.progress >= 1.0) { state.progress -= 1.0; state.logicalStep++; }
        let idx0, idx1;
        if (mode === 'forward') {
          idx0 = ((state.logicalStep % total) + total) % total;
          idx1 = (idx0 + 1) % total;
        } else if (mode === 'backward') {
          idx0 = total - 1 - ((state.logicalStep % total) + total) % total;
          idx1 = total - 1 - (((state.logicalStep + 1) % total) + total) % total;
        } else {
          const cycle = total > 1 ? (total - 1) * 2 : 1;
          const pos = ((state.logicalStep % cycle) + cycle) % cycle;
          if (pos < total - 1) { idx0 = pos; idx1 = pos + 1; }
          else { const rev = cycle - pos; idx0 = rev; idx1 = Math.max(0, rev - 1); }
        }
        const p0 = wps[idx0], p1 = wps[idx1], t = state.progress;
        state.currentPosition = { x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t };
        if (!isFinite(state.currentPosition.x) || !isFinite(state.currentPosition.y)) {
          state.currentPosition = { ...wps[0] };
        }
        config.position = { ...state.currentPosition };
      }

      // 波形控制
      if (config.wave?.enabled) {
        const { amplitude, frequency, phase = 0 } = config.wave;
        const speedMag = Math.hypot(config.velocity.x, config.velocity.y);
        if (isFinite(amplitude) && isFinite(frequency) && isFinite(speedMag) && speedMag > 0) {
          const angle = amplitude * Math.sin(2 * Math.PI * frequency * this.time + phase);
          const baseAngle = Math.atan2(config.velocity.y, config.velocity.x);
          const newAngle = baseAngle + angle;
          config.velocity = { x: speedMag * Math.cos(newAngle), y: speedMag * Math.sin(newAngle) };
        }
      }

      // 执行注入
      if (!isFinite(config.position.x) || !isFinite(config.position.y)) continue;
      if (!isFinite(config.velocity.x) || !isFinite(config.velocity.y)) continue;

      const texPos = { position: config.position, radius: config.radius, obstacle: this.getObstacleTex() };

      // 颜色注入（仅 vector 模式）
      if (!isScalar) {
        this.injectColor(this.colorGrid, {
          h: config.color[0], s: config.color[1], l: config.color[2], a: config.color[3],
        }, 1.0, texPos, ch);
      }

      // 速度注入
      this.injectVelocity(this.velocityGrid, { x: config.velocity.x, y: config.velocity.y }, texPos);

      // density 注入（仅 scalar 模式）
      if (isScalar && config.density !== undefined) {
        this.injectDensity(this.densityGrid, config.density, 1.0, texPos);
      }
    }
  }

  // ---------- 边界处理 ----------
  applyBoundary() {
    const { w, h } = this.config.resolution;
    const mat = this.gpu.getMaterial('boundary', {
      velTex: { value: this.velocityGrid.read },
      resolution: { value: new THREE.Vector2(w, h) },
    }, `
      uniform sampler2D velTex;
      uniform vec2 resolution;
      varying vec2 vUv;
      void main() {
        vec2 vel = texture2D(velTex, vUv).rg;
        float eps = 1.0 / resolution.x;
        if (vUv.x < eps) vel = texture2D(velTex, vec2(vUv.x + eps, vUv.y)).rg;
        else if (vUv.x > 1.0 - eps) vel = texture2D(velTex, vec2(vUv.x - eps, vUv.y)).rg;
        if (vUv.y < eps) vel = texture2D(velTex, vec2(vUv.x, vUv.y + eps)).rg;
        else if (vUv.y > 1.0 - eps) vel = texture2D(velTex, vec2(vUv.x, vUv.y - eps)).rg;
        gl_FragColor = vec4(vel, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.velocityGrid.write, mat);
    this.velocityGrid.swap();
  }

  // ---------- 压力投影（红-黑 SOR）----------
  solvePressure(iterations, omega) {
    const { w, h } = this.config.resolution;
    if (w === 0 || h === 0) return;
    if (!this.config.enableWarmStart) this.clearGrid(this.pressureGrid);

    for (let iter = 0; iter < iterations; iter++) {
      this.runSORPass('red', omega);
      this.runSORPass('black', omega);
    }
  }

  runSORPass(passColor, omega) {
    const { w, h } = this.config.resolution;
    const isRedPass = passColor === 'red';
    const boundaryMode = this.config.pressureBoundaryMode || 'dirichlet';

    const mat = this.gpu.getMaterial(`sor_${isRedPass ? 'red' : 'black'}_${boundaryMode}`, {
      uPressure: { value: this.pressureGrid.read },
      uVelocity: { value: this.velocityGrid.read },
      uObstacle: { value: this.getObstacleTex() },
      uOmega: { value: omega },
      uInvRes: { value: new THREE.Vector2(1.0 / w, 1.0 / h) },
      uIsRed: { value: isRedPass ? 1 : 0 },
      uBoundaryMode: { value: boundaryMode === 'neumann' ? 1 : 0 },
    }, `
      uniform sampler2D uPressure;
      uniform sampler2D uVelocity;
      uniform sampler2D uObstacle;
      uniform float uOmega;
      uniform vec2 uInvRes;
      uniform int uIsRed;
      uniform int uBoundaryMode;
      varying vec2 vUv;
      void main() {
        // 墙内压力强制为 0
        if (texture2D(uObstacle, vUv).r > 0.5) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }
        vec2 ts = uInvRes;
        // 边界处理
        if (uBoundaryMode == 0) {
          // Dirichlet: 边缘压力 = 0
          if (vUv.x < ts.x || vUv.x > 1.0 - ts.x || vUv.y < ts.y || vUv.y > 1.0 - ts.y) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }
        }
        // 红黑判断：基于像素坐标
        vec2 pixel = vUv / ts;
        ivec2 ipixel = ivec2(int(pixel.x), int(pixel.y));
        int parity = (ipixel.x + ipixel.y) & 1;
        // isRed=1 → 更新 parity==1 的像素; isRed=0 → 更新 parity==0 的像素
        if (uIsRed == 1) {
          if (parity == 0) { gl_FragColor = texture2D(uPressure, vUv); return; }
        } else {
          if (parity == 1) { gl_FragColor = texture2D(uPressure, vUv); return; }
        }
        // 邻居压力（墙内邻居视为 0）
        float pL = texture2D(uObstacle, vUv + vec2(-ts.x, 0.0)).r > 0.5 ? 0.0 : texture2D(uPressure, vUv + vec2(-ts.x, 0.0)).r;
        float pR = texture2D(uObstacle, vUv + vec2( ts.x, 0.0)).r > 0.5 ? 0.0 : texture2D(uPressure, vUv + vec2( ts.x, 0.0)).r;
        float pT = texture2D(uObstacle, vUv + vec2(0.0,  ts.y)).r > 0.5 ? 0.0 : texture2D(uPressure, vUv + vec2(0.0,  ts.y)).r;
        float pB = texture2D(uObstacle, vUv + vec2(0.0, -ts.y)).r > 0.5 ? 0.0 : texture2D(uPressure, vUv + vec2(0.0, -ts.y)).r;
        // 速度散度
        float vL = texture2D(uVelocity, vUv + vec2(-ts.x, 0.0)).r;
        float vR = texture2D(uVelocity, vUv + vec2( ts.x, 0.0)).r;
        float vB = texture2D(uVelocity, vUv + vec2(0.0, -ts.y)).g;
        float vT = texture2D(uVelocity, vUv + vec2(0.0,  ts.y)).g;
        float div = (vR - vL) * 0.5 / ts.x + (vT - vB) * 0.5 / ts.y;
        float pOld = texture2D(uPressure, vUv).r;
        float pNew = (1.0 - uOmega) * pOld + uOmega * (pL + pR + pT + pB - div) * 0.25;
        gl_FragColor = vec4(pNew, 0.0, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.pressureGrid.write, mat);
    this.pressureGrid.swap();
  }

  applyPressureGradient() {
    const { w, h } = this.config.resolution;
    const mat = this.gpu.getMaterial('pressureGradient', {
      uPressure: { value: this.pressureGrid.read },
      uVelocity: { value: this.velocityGrid.read },
      uObstacle: { value: this.getObstacleTex() },
      uInvRes: { value: new THREE.Vector2(1.0 / w, 1.0 / h) },
    }, `
      uniform sampler2D uPressure;
      uniform sampler2D uVelocity;
      uniform sampler2D uObstacle;
      uniform vec2 uInvRes;
      varying vec2 vUv;
      void main() {
        if (texture2D(uObstacle, vUv).r > 0.5) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }
        vec2 ts = uInvRes;
        float pL = texture2D(uPressure, vUv + vec2(-ts.x, 0.0)).r;
        float pR = texture2D(uPressure, vUv + vec2( ts.x, 0.0)).r;
        float pT = texture2D(uPressure, vUv + vec2(0.0,  ts.y)).r;
        float pB = texture2D(uPressure, vUv + vec2(0.0, -ts.y)).r;
        vec2 gradP = vec2(pR - pL, pT - pB) * 0.5 / ts;
        vec2 vel = texture2D(uVelocity, vUv).rg;
        vel -= gradP;
        gl_FragColor = vec4(vel, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.velocityGrid.write, mat);
    this.velocityGrid.swap();
  }

  // ---------- 速度限幅/缩放 ----------
  clampVelocity(maxSpeed) {
    const mat = this.gpu.getMaterial('clampVel', {
      uVelocity: { value: this.velocityGrid.read },
      uMaxSpeed: { value: maxSpeed },
    }, `
      uniform sampler2D uVelocity;
      uniform float uMaxSpeed;
      varying vec2 vUv;
      void main() {
        vec2 vel = texture2D(uVelocity, vUv).rg;
        float len = length(vel);
        if (len > uMaxSpeed) vel = vel / len * uMaxSpeed;
        gl_FragColor = vec4(vel, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.velocityGrid.write, mat);
    this.velocityGrid.swap();
  }

  scaleVelocity(scale) {
    const mat = this.gpu.getMaterial('scaleVel', {
      uVelocity: { value: this.velocityGrid.read },
      uScale: { value: scale },
    }, `
      uniform sampler2D uVelocity;
      uniform float uScale;
      varying vec2 vUv;
      void main() {
        vec2 vel = texture2D(uVelocity, vUv).rg;
        gl_FragColor = vec4(vel * uScale, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.velocityGrid.write, mat);
    this.velocityGrid.swap();
  }

  // ---------- density 衰减 ----------
  decayDensity() {
    const decayRate = this.config.scalarConfig?.decayRate ?? 0;
    if (!decayRate || decayRate <= 0) return;
    const keep = Math.max(0.01, 1 - Math.min(0.99, decayRate));
    const mat = this.gpu.getMaterial('decayDensity', {
      uDensity: { value: this.densityGrid.read },
      uKeep: { value: keep },
    }, `
      uniform sampler2D uDensity;
      uniform float uKeep;
      varying vec2 vUv;
      void main() {
        float d = texture2D(uDensity, vUv).r;
        gl_FragColor = vec4(d * uKeep, 0.0, 0.0, 1.0);
      }
    `);
    this.gpu.render(this.renderer, this.densityGrid.write, mat);
    this.densityGrid.swap();
  }

  // ---------- 单步模拟 ----------
  step(dt) {
    if (dt <= 0) return;
    this.frameCount++;
    const cfg = this.config;
    const isScalar = cfg.advectionMode === 'scalar';
    const gridDensity = isScalar ? this.densityGrid : null;

    // ============ step 调试日志（每 60 帧 + 前 10 帧打印） ============
    const _dbg = (this.frameCount <= 10) || (this.frameCount % 60 === 0);
    if (_dbg) {
      log(`--- step#${this.frameCount} (dt=${dt.toFixed(4)}s, mode=${isScalar?'SCALAR':'VECTOR'}) ---`, 'info');
    }

    // 0. 重力
    this.applyGravity(dt);
    if (_dbg && (cfg.gravity.x!==0||cfg.gravity.y!==0))
      log(`  0.重力: (${cfg.gravity.x},${cfg.gravity.y})`, 'info');

    // 1. 持续注入源
    this.processContinuousSources(dt);
    if (_dbg && this.continuousSources.length>0) {
      const _n = Math.min(this.continuousSources.length, 2);
      const _srcs = [];
      for (let _i=0; _i<_n; _i++) {
        const s = this.continuousSources[_i].config;
        if (!s.enabled) continue;
        const _inj = isScalar ? `density=${s.density?.toFixed(2)}` : `color=[${s.color?.map(c=>c?.toFixed(2)).join(',')}]`;
        _srcs.push(`#${_i}[${_inj}]`);
      }
      log(`  1.持续注入: ${this.continuousSources.filter(s=>s.config.enabled).length}个激活 → ${isScalar?'注入速度+density到densityGrid(不修改colorGrid)':'注入速度+颜色到colorGrid'} ${_srcs.join(' ')}`, 'info');
    }

    // 2. 平流
    if (cfg.enableAdvection) {
      // 速度自平流
      this.advect(this.velocityGrid, this.velocityGrid.read, dt,
        { r: true, g: true, b: false, a: false }, 'clamp', false);
      if (_dbg) log(`  2a.速度自平流: velocityGrid(2ch half-float) self-advection`, 'info');
      // 颜色/density 平流
      if (isScalar) {
        this.advect(this.densityGrid, this.velocityGrid.read, dt,
          { r: true, g: false, b: false, a: false }, 'clamp', false);
        this.decayDensity();
        if (_dbg) log(`  2b.SCALAR: densityGrid 平流 + decay(density=${cfg.scalarConfig?.decayRate?.toFixed(3)})  ★ colorGrid 保持静态！完全不平流！`, 'info');
      } else {
        this.advect(this.colorGrid, this.velocityGrid.read, dt,
          cfg.channels, cfg.colorBoundaryMode || 'clamp', true);
        if (_dbg) log(`  2b.VECTOR: colorGrid 平流 (wrapHue=true on R 色相随速度移动)`, 'info');
      }
    } else if (_dbg) log(`  2.平流已跳过 (enableAdvection=false)`, 'warn');

    // 2.5 边界
    this.applyBoundary();

    // 3. 压力投影
    if (cfg.enablePressure) {
      this.solvePressure(cfg.pressureIterations, cfg.pressureOmega);
      this.applyPressureGradient();
    }

    // 3.5 速度缩放
    const velScale = cfg.velocityScale ?? 1;
    if (velScale !== 1) this.scaleVelocity(velScale);

    // 3.6 速度限幅
    const maxVel = cfg.maxVelocity ?? 5000;
    if (maxVel > 0 && isFinite(maxVel)) this.clampVelocity(maxVel);

    // 4. 手动注入（点击画布）
    if (this.manualInjection) {
      const inj = this.manualInjection;
      const texPos = { position: inj.position, radius: inj.radius, obstacle: this.getObstacleTex() };
      if (!isScalar) {
        this.injectColor(this.colorGrid, inj.color, 1.0, texPos, cfg.channels);
      } else if (inj.density !== undefined) {
        this.injectDensity(this.densityGrid, inj.density, 1.0, texPos);
      }
      this.injectVelocity(this.velocityGrid, inj.velocity, texPos);
      this.manualInjection = null;
    }

    this.time += dt;
  }

  // ---------- 调整 canvas 绘图缓冲区为纹理原生分辨率 ----------
  // ★ canvas 绘图缓冲区 = texSize（原生分辨率），CSS 显示尺寸固定 512px（由 CSS 控制）
  //   残差纹理 1:1 采样，无缩放插值 → 无噪点
  //   浏览器用 image-rendering: auto 平滑缩放最终 RGB 到 512×512 显示
  resizeCanvas() {
    const size = this.texSize;
    if (this.canvas.width === size && this.canvas.height === size) return;
    // false = 不修改 CSS style（保持 CSS 的 512×512 显示尺寸）
    this.renderer.setSize(size, size, false);
    log(`Canvas 绘图缓冲区: ${size}×${size}（CSS 显示: 512×512）`, 'info');
  }

  // ---------- 预览渲染（仅 FTX 导入后，无 config 时显示 base+residual 合成视图）----------
  renderPreview() {
    if (!this.baseHslTex || !this._pendingResidual) return;
    const w = this.texSize, h = this.texSize;

    // 创建/更新预览用 residual 纹理（直接从 _pendingResidual Uint8Array RGBA 上传）
    // ★ 使用 NearestFilter：残差存储的是量化值（H:0-63, S/L:0-31 编码在 0-255），
    //   LinearFilter 会在相邻量化值间插值产生无意义中间值→噪点
    if (!this._previewResidualTex) {
      this._previewResidualTex = new THREE.DataTexture(
        this._pendingResidual, w, h, THREE.RGBAFormat, THREE.UnsignedByteType
      );
      this._previewResidualTex.minFilter = THREE.NearestFilter;
      this._previewResidualTex.magFilter = THREE.NearestFilter;
      this._previewResidualTex.flipY = false;
      this._previewResidualTex.needsUpdate = true;
    } else {
      this._previewResidualTex.image = { data: this._pendingResidual, width: w, height: h };
      this._previewResidualTex.needsUpdate = true;
    }

    // 创建/复用预览合成材质（vector 模式：final = base + delta，无 density 调制）
    if (!this._previewMat) {
      this._previewMat = new THREE.ShaderMaterial({
        uniforms: {
          uBaseTexture: { value: this.baseHslTex },
          uResidual: { value: this._previewResidualTex },
          uResidualRangeH: { value: 0.5 },
          uResidualRangeSL: { value: 0.5 },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv=vec2(uv.x,1.0-uv.y); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          uniform sampler2D uBaseTexture;
          uniform sampler2D uResidual;
          uniform float uResidualRangeH;
          uniform float uResidualRangeSL;
          varying vec2 vUv;
          vec3 hsl_to_rgb(vec3 hsl) {
            float h = hsl.x, s = hsl.y, l = hsl.z;
            vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
          }
          void main() {
            vec4 baseHSLA = texture2D(uBaseTexture, vUv);
            vec4 residual = texture2D(uResidual, vUv);
            float dH = (residual.r * 2.0 - 1.0) * uResidualRangeH;
            float dS = (residual.g * 2.0 - 1.0) * uResidualRangeSL;
            float dL = (residual.b * 2.0 - 1.0) * uResidualRangeSL;
            float finalH = fract(baseHSLA.r + dH);
            float finalS = clamp(baseHSLA.g + dS, 0.0, 1.0);
            float finalL = clamp(baseHSLA.b + dL, 0.0, 1.0);
            float finalA = baseHSLA.a;
            vec3 finalRGB = hsl_to_rgb(vec3(finalH, finalS, finalL));
            gl_FragColor = vec4(finalRGB, finalA);
          }
        `,
        transparent: true,
      });
      this._previewScene = new THREE.Scene();
      this._previewMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this._previewMat);
      this._previewScene.add(this._previewMesh);
      this._previewCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    } else {
      this._previewMat.uniforms.uBaseTexture.value = this.baseHslTex;
      this._previewMat.uniforms.uResidual.value = this._previewResidualTex;
    }

    this.renderer.render(this._previewScene, this._previewCam);
  }

  // ---------- 合成渲染 ----------
  render() {
    // 无 config 时（仅导入 FTX 后），退化为预览渲染
    if (!this.config) {
      this.renderPreview();
      return;
    }
    const cfg = this.config;
    const isScalar = cfg.advectionMode === 'scalar';
    const sc = cfg.scalarConfig || {};
    const ch = cfg.channels;

    const uniforms = {
      uBaseTexture: { value: this.baseHslTex },
      uResidual: { value: this.colorGrid.read },
      uResidualRangeH: { value: 0.5 },
      uResidualRangeSL: { value: 0.5 },
      uDensity: { value: this.densityGrid.read },
      uChannelMul: { value: new THREE.Vector4(sc.hMultiplier ?? 1, sc.sMultiplier ?? 1, sc.lMultiplier ?? 1, sc.aMultiplier ?? 1) },
      uBaseline: { value: sc.baselineDensity ?? 1.0 },
      uScalarMode: { value: isScalar ? 1 : 0 },
      uCombineMode: { value: (cfg.combineMode || 'add') === 'sub' ? 1 : 0 },
      uChannels: { value: new THREE.Vector4(ch.r ? 1 : 0, ch.g ? 1 : 0, ch.b ? 1 : 0, ch.a ? 1 : 0) },
    };

    // ============ render 调试日志（仅每 60 帧打印一次，避免刷屏）============
    if (!this._renderLogCnt) this._renderLogCnt = 0;
    const _doLog = (this._renderLogCnt++ % 60 === 0);
    if (_doLog) {
      const _mode = isScalar ? 'SCALAR' : 'VECTOR';
      log(`[render#${this.frameCount||0}] 【合成着色器 Debug | ${_mode}模式】`, 'info');
      log(`   uBaseTexture : baseHslTex (FloatType RGBA, HSL 范围 0~1)  flipY=${this.baseHslTex?.flipY}`, 'info');
      log(`   uResidual    : colorGrid.read [${this.colorGrid.read.width}x${this.colorGrid.read.height}] filter=${this.colorGrid.texA.texture.minFilter===1008?'Linear':'Nearest(✅防噪点)'}`, 'info');
      log(`   uResidualRangeH=0.5, RangeSL=0.5 (固定值: range=0.25 块已在 buildTextures* 中重映射到 0.5 范围)`, 'info');
      log(`   uDensity     : densityGrid.read [${this.densityGrid.read.width}x${this.densityGrid.read.height}]`, 'info');
      log(`   uChannelMul  : (H=${sc.hMultiplier?.toFixed(3)}, S=${sc.sMultiplier?.toFixed(3)}, L=${sc.lMultiplier?.toFixed(3)}, A=${sc.aMultiplier?.toFixed(3)})`, 'info');
      log(`   uBaseline    : ${sc.baselineDensity?.toFixed(3)}   (factor = density / baseline)`, 'info');
      log(`   uChannels    : H=${ch.r?1:0} S=${ch.g?1:0} L=${ch.b?1:0} A=${ch.a?1:0} (1=正常公式, 0=绕过 base+delta 直接输出残差)`, 'info');
      log(`   scalarMode=${isScalar?1:0} combineMode=${(cfg.combineMode||'add')==='sub'?'sub(-1)':'add(+1)'}`, 'info');
      if (isScalar) {
        log(`   ★ SCALAR 公式: final = base + delta ± factor × mul  (density=0 → factor=0 → 只显示 base+delta)`, 'info');
        log(`   ★ SCALAR 关键: colorGrid 是静态模板！不平流不注入！流体变化全部来自 density×mul 调制项`, 'info');
      } else {
        log(`   ★ VECTOR 公式: final = base + delta  (colorGrid 不平流就不动)`, 'info');
      }
    }

    if (!this._compositeMat) {
      this._compositeMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `varying vec2 vUv; void main(){ vUv=vec2(uv.x,1.0-uv.y); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          uniform sampler2D uBaseTexture;
          uniform sampler2D uResidual;
          uniform float uResidualRangeH;
          uniform float uResidualRangeSL;
          uniform sampler2D uDensity;
          uniform vec4 uChannelMul;
          uniform float uBaseline;
          uniform int uScalarMode;
          uniform int uCombineMode;
          uniform vec4 uChannels;
          varying vec2 vUv;
          vec3 hsl_to_rgb(vec3 hsl) {
            float h = hsl.x, s = hsl.y, l = hsl.z;
            vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
          }
          void main() {
            vec4 baseHSLA = texture2D(uBaseTexture, vUv);
            vec4 residual = texture2D(uResidual, vUv);
            float dH = (residual.r * 2.0 - 1.0) * uResidualRangeH;
            float dS = (residual.g * 2.0 - 1.0) * uResidualRangeSL;
            float dL = (residual.b * 2.0 - 1.0) * uResidualRangeSL;
            float finalH, finalS, finalL, finalA;
            if (uScalarMode == 1) {
              float density = texture2D(uDensity, vUv).r;
              float factor = density / max(uBaseline, 0.001);
              float sign = (uCombineMode == 0) ? 1.0 : -1.0;
              finalH = fract(baseHSLA.r + dH + sign * factor * uChannelMul.x);
              finalS = clamp(baseHSLA.g + dS + sign * factor * uChannelMul.y, 0.0, 1.0);
              finalL = clamp(baseHSLA.b + dL + sign * factor * uChannelMul.z, 0.0, 1.0);
              float dA = (residual.a * 2.0 - 1.0) * uResidualRangeSL;
              finalA = clamp(baseHSLA.a + dA + sign * factor * uChannelMul.w, 0.0, 1.0);
            } else {
              finalH = fract(baseHSLA.r + dH);
              finalS = clamp(baseHSLA.g + dS, 0.0, 1.0);
              finalL = clamp(baseHSLA.b + dL, 0.0, 1.0);
              finalA = baseHSLA.a;
            }
            finalH = mix(residual.r, finalH, uChannels.x);
            finalS = mix(residual.g, finalS, uChannels.y);
            finalL = mix(residual.b, finalL, uChannels.z);
            finalA = mix(residual.a, finalA, uChannels.w);
            vec3 finalRGB = hsl_to_rgb(vec3(finalH, finalS, finalL));
            gl_FragColor = vec4(finalRGB, finalA);
          }
        `,
        transparent: true,
      });
      this._compositeScene = new THREE.Scene();
      this._compositeMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this._compositeMat);
      this._compositeScene.add(this._compositeMesh);
      this._compositeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    } else {
      // 更新动态 uniforms
      const u = this._compositeMat.uniforms;
      // ★ 必须更新 uBaseTexture：loadFTX 会销毁重建 baseHslTex，
      //   不更新会导致 uniform 仍指向已销毁的旧纹理 → 残留上一个纹理的数据
      u.uBaseTexture.value = this.baseHslTex;
      u.uResidual.value = this.colorGrid.read;
      u.uDensity.value = this.densityGrid.read;
      u.uChannelMul.value.set(sc.hMultiplier ?? 1, sc.sMultiplier ?? 1, sc.lMultiplier ?? 1, sc.aMultiplier ?? 1);
      u.uBaseline.value = sc.baselineDensity ?? 1.0;
      u.uScalarMode.value = isScalar ? 1 : 0;
      u.uCombineMode.value = (cfg.combineMode || 'add') === 'sub' ? 1 : 0;
      u.uChannels.value.set(ch.r ? 1 : 0, ch.g ? 1 : 0, ch.b ? 1 : 0, ch.a ? 1 : 0);
    }

    this.renderer.render(this._compositeScene, this._compositeCam);
  }

  // ---------- 源列表 UI ----------
  renderSourceList() {
    const listEl = document.getElementById('source-list');
    document.getElementById('info-src-count').textContent = this.continuousSources.length;
    listEl.innerHTML = '';
    for (const src of this.continuousSources) {
      const c = src.config;
      const speed = Math.hypot(c.velocity.x, c.velocity.y);
      const item = document.createElement('div');
      item.className = 'source-item';
      let html = `<div class="src-header"><span class="src-id">#${src.id}</span><span>${c.enabled ? '✅' : '⏸'}</span></div>`;
      html += `<div class="src-detail">pos=(${c.position.x.toFixed(2)}, ${c.position.y.toFixed(2)}) r=${c.radius.toFixed(2)} v=${speed.toFixed(0)}</div>`;
      if (c.wave?.enabled) html += `<div class="src-wave">〰 amp=${c.wave.amplitude.toFixed(2)} freq=${c.wave.frequency.toFixed(1)}Hz</div>`;
      if (c.waypoints && c.waypoints.length >= 2) html += `<div class="src-wp">📍 ${c.waypoints.length}点 ${c.waypointMode || 'forward'} ${c.waypointSpeed?.toFixed(1)}/s</div>`;
      item.innerHTML = html;
      listEl.appendChild(item);
    }
  }

  // ---------- 重置 ----------
  reset() {
    this.time = 0;
    this.frameCount = 0;
    this.waypointStates.clear();
    this.initFields();
    if (this._pendingResidual) {
      this.uploadToColorGrid(this._pendingResidual);
    }
    log('场已重置', 'info');
  }

  dispose() {
    this.colorGrid?.dispose();
    this.velocityGrid?.dispose();
    this.pressureGrid?.dispose();
    this.densityGrid?.dispose();
    this.baseHslTex?.dispose();
    this.obstacleTex?.dispose();
    this._previewResidualTex?.dispose();
    this._previewMat?.dispose();
    this._compositeMat?.dispose();
    this.renderer.dispose();
  }
}

// ============================================================
// UI 控制 + 主循环
// ============================================================
const canvas = document.getElementById('fluid-canvas');
const player = new FluidPlayer(canvas);
let playing = false;
let speed = 1.0;
let lastTime = 0;

// 文件导入
document.getElementById('btn-import-ftx').onclick = () => document.getElementById('file-ftx').click();
document.getElementById('btn-import-json').onclick = () => document.getElementById('file-json').click();

document.getElementById('file-ftx').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    await player.loadFTX(buf);
    document.getElementById('status-ftx').textContent = '已加载';
    document.getElementById('status-ftx').className = 'status-badge status-loaded';
    document.getElementById('btn-import-json').disabled = false;
    document.getElementById('drop-hint').style.display = 'none';
    document.getElementById('info-res').textContent = `${player.texSize}×${player.texSize}`;
  } catch (err) {
    log(`FTX 加载失败: ${err.message}`, 'error');
  }
};

document.getElementById('file-json').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    player.loadConfig(json);
    document.getElementById('status-json').textContent = '已加载';
    document.getElementById('status-json').className = 'status-badge status-loaded';
    document.getElementById('btn-play').disabled = false;
    document.getElementById('btn-reset').disabled = false;
    // 更新信息面板 — 显示所有流体库参数
    const cfg = player.config;
    const sc = cfg.scalarConfig || {};
    document.getElementById('info-mode').textContent = cfg.advectionMode;
    document.getElementById('info-combine').textContent = cfg.combineMode || 'add';
    document.getElementById('info-res').textContent = `${cfg.resolution.w}×${cfg.resolution.h}`;
    document.getElementById('info-channels').textContent = `${cfg.channels.r?'H':'·'}${cfg.channels.g?'S':'·'}${cfg.channels.b?'L':'·'}${cfg.channels.a?'A':'·'}`;
    document.getElementById('info-adv').textContent = cfg.enableAdvection ? '✅' : '❌';
    document.getElementById('info-press').textContent = cfg.enablePressure ? '✅' : '❌';
    document.getElementById('info-pressure').textContent = `${cfg.pressureIterations}×`;
    document.getElementById('info-omega').textContent = cfg.pressureOmega;
    document.getElementById('info-pbound').textContent = cfg.pressureBoundaryMode;
    document.getElementById('info-warm').textContent = cfg.enableWarmStart ? '✅' : '❌';
    document.getElementById('info-gravity').textContent = `(${cfg.gravity.x}, ${cfg.gravity.y})`;
    document.getElementById('info-vscale').textContent = cfg.velocityScale;
    document.getElementById('info-maxvel').textContent = cfg.maxVelocity;
    document.getElementById('info-cbound').textContent = cfg.colorBoundaryMode;
    document.getElementById('info-obstacle').textContent = player.obstacleTex ? '有' : '无';
    document.getElementById('info-baseline').textContent = sc.baselineDensity ?? '-';
    document.getElementById('info-decay').textContent = sc.decayRate ?? '-';
    document.getElementById('info-hmul').textContent = sc.hMultiplier ?? '-';
    document.getElementById('info-smul').textContent = sc.sMultiplier ?? '-';
    document.getElementById('info-lmul').textContent = sc.lMultiplier ?? '-';
    document.getElementById('info-amul').textContent = sc.aMultiplier ?? '-';
    // loadConfig 已内置 initFields + render，这里只需更新 UI
    log('准备就绪，点击播放', 'info');
  } catch (err) {
    log(`JSON 加载失败: ${err.message}`, 'error');
  }
};

// 播放/暂停
document.getElementById('btn-play').onclick = () => {
  playing = !playing;
  const btn = document.getElementById('btn-play');
  btn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  document.getElementById('status-json').textContent = playing ? '播放中' : '已加载';
  document.getElementById('status-json').className = `status-badge ${playing ? 'status-active' : 'status-loaded'}`;
  if (playing) {
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
};

// 重置
document.getElementById('btn-reset').onclick = () => {
  player.reset();
  player.render();
  document.getElementById('val-frame').textContent = '0';
  log('已重置到初始状态', 'info');
};

// 速度控制
document.getElementById('ctrl-speed').oninput = (e) => {
  speed = parseFloat(e.target.value);
  document.getElementById('val-speed').textContent = speed.toFixed(1) + 'x';
};

// 帧切换
document.getElementById('ctrl-frame').onchange = (e) => {
  player.switchFrame(parseInt(e.target.value));
};

// 背景控制
document.getElementById('ctrl-bg').onchange = (e) => {
  const v = e.target.value;
  canvas.style.background = v === 'transparent' ? 'transparent' : v;
};

// 缩放控制
document.getElementById('ctrl-zoom').oninput = (e) => {
  const z = parseFloat(e.target.value);
  document.getElementById('val-zoom').textContent = z.toFixed(1) + 'x';
  canvas.style.width = (512 * z) + 'px';
  canvas.style.height = (512 * z) + 'px';
};

// 手动注入参数
document.getElementById('manual-speed').oninput = (e) => {
  document.getElementById('val-manual-speed').textContent = e.target.value;
};
document.getElementById('manual-radius').oninput = (e) => {
  document.getElementById('val-manual-radius').textContent = parseFloat(e.target.value).toFixed(2);
};

// 画布点击注入
canvas.onclick = (e) => {
  if (!player.config) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  const speedVal = parseFloat(document.getElementById('manual-speed').value);
  const radius = parseFloat(document.getElementById('manual-radius').value);
  const hex = document.getElementById('manual-color').value;
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  // RGB → HSL
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  player.manualInjection = {
    position: { x, y },
    radius,
    velocity: { x: 0, y: speedVal },
    color: { h, s, l, a: 1.0 },
    density: player.config.advectionMode === 'scalar' ? 1.0 : undefined,
  };
  log(`手动注入: (${x.toFixed(2)}, ${y.toFixed(2)}) v=${speedVal}`, 'info');
};

// 主循环
let fpsStartTime = 0, fpsFrameCount = 0, currentFps = 0;
function loop(now) {
  if (!playing) return;
  const dt = Math.min(0.033, (now - lastTime) / 1000) * speed; // 限制最大 dt，防止卡顿后大跳
  lastTime = now;

  player.step(dt);
  player.render();

  // FPS 统计（每秒更新一次）
  fpsFrameCount++;
  if (fpsStartTime === 0) fpsStartTime = now;
  if (now - fpsStartTime >= 1000) {
    currentFps = Math.round((fpsFrameCount * 1000) / (now - fpsStartTime));
    document.getElementById('val-fps').textContent = `${currentFps} fps`;
    fpsStartTime = now;
    fpsFrameCount = 0;
  }
  document.getElementById('val-frame').textContent = player.frameCount;

  requestAnimationFrame(loop);
}

// 拖放支持
const wrap = document.getElementById('canvas-wrap');
wrap.ondragover = (e) => { e.preventDefault(); };
wrap.ondrop = async (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const lowerName = file.name.toLowerCase();
  if (lowerName.endsWith('.ftx') || lowerName.endsWith('.ftx3') || lowerName.endsWith('.ftx.gz') || lowerName.endsWith('.ftx3.gz')) {
    const buf = await file.arrayBuffer();
    await player.loadFTX(buf);
    document.getElementById('status-ftx').textContent = '已加载';
    document.getElementById('status-ftx').className = 'status-badge status-loaded';
    document.getElementById('btn-import-json').disabled = false;
    document.getElementById('drop-hint').style.display = 'none';
    document.getElementById('info-res').textContent = `${player.texSize}×${player.texSize}`;
  } else if (lowerName.endsWith('.json')) {
    const text = await file.text();
    const json = JSON.parse(text);
    player.loadConfig(json);
    document.getElementById('status-json').textContent = '已加载';
    document.getElementById('status-json').className = 'status-badge status-loaded';
    document.getElementById('btn-play').disabled = false;
    document.getElementById('btn-reset').disabled = false;
    player.initFields();
    player.render();
  }
};

log('播放器初始化完成，等待导入数据', 'info');
</script>
</body>
</html>
