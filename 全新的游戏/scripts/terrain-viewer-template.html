<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>地形对比 —— L1 语义表（新） vs 创建时原始地形（旧）</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #d8dee9; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 12px 16px 6px; }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: #8b95a5; font-size: 12px; }
  .stats { color: #a9b4c4; font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 12px 16px 24px; }
  .panel { background: #1b1e24; border: 1px solid #2b303a; border-radius: 8px; padding: 10px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; color: #e6edf7; }
  canvas { image-rendering: pixelated; display: block; width: 100%; height: auto; background: #000; border-radius: 4px; cursor: crosshair; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 11px; color: #aab4c4; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #tip { position: fixed; pointer-events: none; background: #0d1117f2; border: 1px solid #39404d; border-radius: 6px;
         padding: 8px 10px; font-size: 12px; white-space: pre; display: none; z-index: 9; box-shadow: 0 4px 18px #0009; }
  .note { padding: 0 16px 18px; color: #7d8797; font-size: 12px; }
  code { background: #22262e; border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<header>
  <h1>地形对比 —— L1 语义表（新） vs 创建时原始地形（旧）</h1>
  <div class="sub" id="meta"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="grid" id="grid"></div>
<div class="note">
  生成：<code>node scripts/tmp/dump-terrain-viewer.mjs</code>（需 <code>npm run dev -- --port 5199 --strictPort</code>）→ 本页自动覆盖刷新。
  鼠标悬停任意格可查看两表原始数值；每格 4m；白十字 = 舰船落点；网格线每 32m。
</div>
<div id="tip"></div>
<script>
const D = /*__DATA__*/ null;
const { side, cell, l1, gen, anchor } = D;
const $ = (id) => document.getElementById(id);

function mkPanel(title, legend) {
  const div = document.createElement('div');
  div.className = 'panel';
  div.innerHTML = `<h2>${title}</h2>`;
  const cv = document.createElement('canvas');
  cv.width = side; cv.height = side; cv.style.width = '100%';
  div.appendChild(cv);
  if (legend) { const lg = document.createElement('div'); lg.className = 'legend'; lg.innerHTML = legend; div.appendChild(lg); }
  $('grid').appendChild(div);
  return { cv, ctx: cv.getContext('2d') };
}
function colorScale(v, min, max, stops) {
  const t = Math.max(0, Math.min(1, (v - min) / (max - min || 1)));
  const n = stops.length - 1, i = Math.min(n - 1, Math.floor(t * n)), f = t * n - i;
  const a = stops[i], b = stops[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
const clsColors = [
  [68,72,80],[255,209,102],[77,150,255],[255,107,53],[46,196,182],[230,57,70],
  [181,23,158],[141,153,174],[87,117,144],[34,34,34],[17,138,178],[0,0,0],
];
const roleColors = [[107,143,71],[176,137,104],[17,138,178],[10,10,10],[80,80,80]];
function px(ctx, ix, iz, rgb, a = 1) {
  ctx.fillStyle = `rgba(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0},${a})`;
  ctx.fillRect(ix, iz, 1, 1);
}
function drawGrid(ctx) {   // 每 32m 网格线 + 舰船标记
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 0.5;
  for (let k = 0; k <= side; k += 8) {
    ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k, side); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(side, k); ctx.stroke();
  }
  const ax = Math.round((anchor.x - (anchor.x - 144) - 2) / 4), az = Math.round((anchor.z - (anchor.z - 144) - 2) / 4);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ax - 4, az); ctx.lineTo(ax + 4, az); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax, az - 4); ctx.lineTo(ax, az + 4); ctx.stroke();
  ctx.beginPath(); ctx.arc(ax, az, 3, 0, Math.PI * 2); ctx.stroke();
}

// ================= 左排：L1 语义表（新） =================
const p1 = mkPanel('L1 语义分类（区块合并后）',
  ['中性','高地','低谷','迎船坡','背船坡','关口','走廊','开阔地','隐蔽','陡壁','水','坑']
    .map((n, i) => `<span><i style="background:rgb(${clsColors[i]})"></i>${n}</span>`).join(''));
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) px(p1.ctx, ix, iz, clsColors[l1.cls[iz * side + ix]]);
drawGrid(p1.ctx);

const p2 = mkPanel('L1 坡向（红=面向舰船/进攻向，蓝=背向舰船/防守向）',
  '<span><i style="background:rgb(255,107,53)"></i>迎船坡 aspect&gt;0</span><span><i style="background:rgb(46,196,182)"></i>背船坡 aspect&lt;0</span><span><i style="background:rgb(68,72,80)"></i>非坡/平地</span>');
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) {
  const i = iz * side + ix;
  if (l1.cls[i] === 3 || l1.cls[i] === 4) px(p2.ctx, ix, iz, colorScale(l1.aspect[i], -1, 1, [[46,196,182],[68,72,80],[255,107,53]]));
  else px(p2.ctx, ix, iz, [30,32,36]);
}
p2.ctx.strokeStyle = 'rgba(255,255,255,.8)'; p2.ctx.lineWidth = 0.6;
for (let iz = 1; iz < side; iz += 3) for (let ix = 1; ix < side; ix += 3) {
  const i = iz * side + ix;
  if (l1.cls[i] !== 3 && l1.cls[i] !== 4) continue;
  p2.ctx.beginPath(); p2.ctx.moveTo(ix, iz);
  p2.ctx.lineTo(ix + l1.dhx[i] * 2.2, iz + l1.dhz[i] * 2.2); p2.ctx.stroke();
}
drawGrid(p2.ctx);

const p3 = mkPanel('L1 隐蔽（暗红 = 对舰船方向被地形遮挡）',
  '<span><i style="background:rgb(87,117,144)"></i>语义底色</span><span><i style="background:rgb(140,30,30)"></i>LOS 被挡（隐蔽）</span>');
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) {
  const i = iz * side + ix;
  px(p3.ctx, ix, iz, l1.blocked[i] ? [140,30,30] : (l1.cls[i] === 9 ? [80,80,80] : [87,117,144]), l1.cls[i] === 10 ? 0.9 : 1);
}
drawGrid(p3.ctx);

// ================= 右排：创建时原始地形（旧） =================
// 面板 4：生成时地块本色（terrainColorAt：无抖动基色，即小地图看到的纯净色）
const p4 = mkPanel('创建时·地块本色（生成器基色；tooltip 看地块 key/genRole）',
  `<span>地块种类 ${D.keys.length} 种；最常见：` + D.topKeys.map((t) => `${t.key}×${t.n}`).join('、') + '</span>');
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) {
  const i = iz * side + ix, c = gen.color[i];
  px(p4.ctx, ix, iz, [(c >> 16) & 255, (c >> 8) & 255, c & 255]);
}
drawGrid(p4.ctx);

// 面板 5：创建时基准高度（未挖；灰阶 + 山体阴影）
let bmin = Infinity, bmax = -Infinity;
for (const v of gen.base) { bmin = Math.min(bmin, v); bmax = Math.max(bmax, v); }
const p5 = mkPanel(`创建时·基准高度（未挖，${bmin.toFixed(1)} ~ ${bmax.toFixed(1)}m；阴影=山体朝向）`,
  '<span><i style="background:rgb(40,40,40)"></i>低</span><span><i style="background:rgb(150,150,150)"></i>中</span><span><i style="background:rgb(235,235,235)"></i>高</span>');
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) {
  const i = iz * side + ix, h = gen.base[i];
  const g = (h - bmin) / ((bmax - bmin) || 1);
  const iL = ix > 0 ? i - 1 : i, iR = ix < side - 1 ? i + 1 : i;
  const iU = iz > 0 ? i - side : i, iD = iz < side - 1 ? i + side : i;
  const dx = (gen.base[iR] - gen.base[iL]) / 8, dz = (gen.base[iD] - gen.base[iU]) / 8;
  const shade = Math.max(0.35, Math.min(1.3, 0.85 + (-dx - dz) * 0.9));   // 光从西北
  const v = Math.max(0, Math.min(255, 40 + g * 195)) * shade;
  px(p5.ctx, ix, iz, [v, v, v]);
  if (gen.role[i] === 2) px(p5.ctx, ix, iz, [17, 138, 178], 0.55);        // 水
  if (gen.role[i] === 3) px(p5.ctx, ix, iz, [0, 0, 0]);                    // 坑
}
drawGrid(p5.ctx);

// 面板 6：创建时结构语义（genRole）+ 已被挖改标记
const p6 = mkPanel('创建时·结构语义 genRole（+洋红=已被挖改）',
  ['ground','platform','liquid','pit'].map((n, i) => `<span><i style="background:rgb(${roleColors[i]})"></i>${n}</span>`).join('')
  + '<span><i style="background:rgb(255,0,255)"></i>已挖改（|当前-基准|&gt;0.05m）</span>');
for (let iz = 0; iz < side; iz++) for (let ix = 0; ix < side; ix++) {
  const i = iz * side + ix;
  px(p6.ctx, ix, iz, roleColors[gen.role[i]]);
  if (Math.abs(gen.cur[i] - gen.base[i]) > 0.05) px(p6.ctx, ix, iz, [255, 0, 255]);
}
drawGrid(p6.ctx);

// ================= 悬停读数 =================
const tip = $('tip');
const canvases = [p1, p2, p3, p4, p5, p6].map((p) => p.cv);
const names = ['中性','高地','低谷','迎船坡','背船坡','关口','走廊','开阔地','隐蔽','陡壁','水','坑'];
const roleNames = ['ground','platform','liquid','pit','?'];
for (const cv of canvases) {
  cv.addEventListener('mousemove', (e) => {
    const r = cv.getBoundingClientRect();
    const ix = Math.floor((e.clientX - r.left) / r.width * side);
    const iz = Math.floor((e.clientY - r.top) / r.height * side);
    if (ix < 0 || iz < 0 || ix >= side || iz >= side) return;
    const i = iz * side + ix;
    const wx = (anchor.x - 144) + ix * 4 + 2, wz = (anchor.z - 144) + iz * 4 + 2;
    const d = Math.hypot(wx - anchor.x, wz - anchor.z);
    const dug = gen.cur[i] - gen.base[i];
    tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - 280, e.clientX + 14) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.textContent =
      `格 (${ix},${iz})  世界 (${wx.toFixed(0)},${wz.toFixed(0)})  离船 ${d.toFixed(0)}m\n`
      + `— L1 语义（新）—\n`
      + `  语义 ${names[l1.cls[i]]}  区块 #${l1.region[i]}\n`
      + `  坡向 ${l1.aspect[i].toFixed(2)}  坡度 ${l1.slope[i].toFixed(2)}  宽 ${l1.width[i].toFixed(2)}\n`
      + `  可走 ${l1.pass[i] ? '是' : '否'}  隐蔽 ${l1.blocked[i] ? '是' : '否'}\n`
      + `— 创建时原始地形（旧）—\n`
      + `  地块 ${D.keys[gen.keyIdx[i]]}  genRole ${roleNames[gen.role[i]]}\n`
      + `  基准高 ${gen.base[i].toFixed(2)}m  当前高 ${gen.cur[i].toFixed(2)}m  挖改 ${dug >= 0 ? '+' : ''}${dug.toFixed(2)}m`;
  });
  cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

$('meta').textContent =
  `舰船锚点 (${anchor.x.toFixed(1)}, ${anchor.z.toFixed(1)}) · 网格 ${side}×${side} · 每格 ${cell}m · 覆盖 ±144m`
  + (D.generatedAt ? ` · 生成于 ${D.generatedAt}` : '');
$('stats').textContent = D.statsText || '';
</script>
</body>
</html>
