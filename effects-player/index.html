<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>特效播放器 Demo</title>
  <style>
    body { margin:0; background:#fff; display:flex; flex-direction:column; align-items:center; font-family:Microsoft YaHei,sans-serif; }
    canvas { width:auto; height:auto; border:1px solid #333; margin-top:8px; image-rendering:pixelated; }
    #controls { color:#fff; width:520px; margin:8px 0; }
    #controls .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
    button { padding:4px 8px; cursor:pointer; background:#333; color:#fff; border:1px solid #555; border-radius:3px; font-size:13px; }
    button:hover { background:#444; }
    button:disabled { opacity:0.3; cursor:default; }
    input[type=file] { display:none; }
    input[type=range] { width:120px; }
    input[type=number] { width:50px; background:#222; color:#fff; border:1px solid #555; padding:2px 4px; }
    select { background:#222; color:#fff; border:1px solid #555; padding:2px 4px; }
    #frameSlider { flex:1; min-width:160px; }
    #info { color:#aaa; font-size:12px; }
    .label { color:#888; font-size:12px; min-width:36px; }
  </style>
</head>
<body>
  <canvas id="c" width="512" height="512"></canvas>
  <div id="controls">
    <div class="row">
      <button onclick="document.getElementById('file').click()">加载特效包</button>
      <input type="file" id="file" accept=".zip" />
      <button onclick="document.getElementById('ftxFile').click()">加载纹理包(.ftx3)</button>
      <input type="file" id="ftxFile" accept=".ftx3,.ftx3.gz,.gz,.bin" />
      <span id="info">未加载</span>
    </div>
    <div class="row">
      <span class="label">帧选择</span>
      <input type="range" id="frameSlider" min="1" max="1" value="1" disabled />
      <input type="number" id="frameNum" min="1" max="1" value="1" disabled style="width:45px" />
      <button id="btnGoto" disabled>跳转</button>
    </div>
    <div class="row">
      <button id="btnPlay" disabled>▶ 播放</button>
      <button id="btnPause" disabled>⏸ 暂停</button>
      <button id="btnStop" disabled>⏹ 停止</button>
      <span class="label">顺序</span>
      <select id="orderSelect" disabled>
        <option value="loop">循环</option>
        <option value="linear">顺序</option>
        <option value="reverse">倒序</option>
        <option value="pingpong">往返</option>
      </select>
      <span class="label">速度</span>
      <input type="number" id="speedInput" value="1" step="0.1" min="-5" max="5" disabled style="width:50px" />
    </div>
    <div class="row">
      <button id="btnHold" disabled>📌 冻结帧</button>
      <button id="btnStepF" disabled>+1 前进</button>
      <button id="btnStepB" disabled>-1 后退</button>
      <span id="holdState" class="label" style="color:#ff0"></span>
    </div>
    <div class="row">
      <span class="label" style="min-width:90px">物理注入</span>
      <button id="physFire">🔥 火焰</button>
      <button id="physWater">💧 水流</button>
      <button id="physPoison">☠️ 毒雾</button>
      <button id="physNone">✖ 清除</button>
      <span id="physState" class="label" style="color:#0ff"></span>
    </div>
    <div class="row">
      <span class="label" style="min-width:90px">击中特效</span>
      <button id="btnHitPreview">💥 预览击中特效</button>
      <button id="btnHitStop" disabled>⏹ 停止</button>
      <span id="hitState" class="label" style="color:#ffd166"></span>
    </div>
    <div class="row">
      <span class="label" style="min-width:90px">调试</span>
      <button id="btnResidView">🔬 残差视图</button>
      <button id="btnCompositeView">🖼️ 合成视图</button>
      <span id="viewState" class="label" style="color:#7cf"></span>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { Asset, FtxAsset, createThreeContext, renderFrameData, renderFtxFrame, disposeFtxQuad } from './src/index.ts';
    import { generateVariant, randomSeed, shapeSeed, tickVariant, variantDuration } from './src/hitEffect/variantGenerator.ts';

    const canvas = document.getElementById('c');
    const ctx = createThreeContext(canvas);
    ctx.renderer.setSize(512, 512);

    function resizeToAsset() {
      if (!asset) return;
      const sz = asset.resolution ?? asset.width;
      canvas.width = sz;
      canvas.height = sz;
      canvas.style.width = sz + 'px';
      canvas.style.height = sz + 'px';
      ctx.renderer.setSize(sz, sz);
    }

    let asset = null;
    let ctrl = null;
    let injectedPhysics = null;  // ★ 公共物理参数（.phys.json 注入，可作用任意纹理）
    let lastTime = performance.now();
    let animTime = 0;  // 独立动画时钟，永不停，给 VAT 用
    let pendingInject = null;  // 按住注入状态 { frame, x, y, active }（canvas 像素坐标）
    let injectTick = 0;        // 注入节流计数器（每 3 帧一次 ≈ 10Hz）
    // ★ 调试视图：'composite'（默认合成）| 'residual'（残差纹理原样）
    let viewMode = 'composite';
    // ★ 残差调试 quad（全屏显示 colorGrid 纹理，映射为可视化颜色）
    let residScene = null, residQuad = null;

    const $ = (id) => document.getElementById(id);
    const frameSlider = $('frameSlider');
    const frameNum = $('frameNum');
    const info = $('info');

    function enableUI() {
      ['btnPlay','btnPause','btnStop','btnHold','btnStepF','btnStepB','btnGoto',
       'orderSelect','speedInput','frameSlider','frameNum'].forEach(
        id => $(id).disabled = false
      );
    }

    function refreshSlider() {
      if (!ctrl) return;
      frameSlider.max = ctrl.frameCount;
      frameSlider.value = fmtFrame(ctrl.frameIndex);
      frameNum.max = ctrl.frameCount;
      frameNum.value = fmtFrame(ctrl.frameIndex);
    }

    const STYLE = { position:{x:0,y:0,z:0}, scale:{x:1,y:1}, rotation:0 };

    const ORDER_MAP = { '循环':'loop', '顺序':'linear', '倒序':'reverse', '往返':'pingpong' };

    function fmtFrame(idx) { return idx + 1; }
    function unfmtFrame(f) { return Math.max(0, f - 1); }

    $('file').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (asset) { ctrl?.dispose(); asset.dispose(); disposeFtxQuad(ctx.scene); }
      try {
        asset = await Asset.load(await file.arrayBuffer(), { resolution: 512 });
        const order = $('orderSelect').value;
        ctrl = asset.createController({ fps: 3, order: ORDER_MAP[order] || 'loop' });
        ctrl.callbacks.onFrameChange = (idx) => {
          frameSlider.value = fmtFrame(idx);
          frameNum.value = fmtFrame(idx);
          info.textContent = `帧${fmtFrame(idx)}/${ctrl.frameCount} | 第${ctrl.currentLoop+1}轮 | ${ctrl.localTime.toFixed(1)}s | ${ctrl.state}`;
        };
        ctrl.callbacks.onComplete = () => { info.textContent += ' [播放完毕]'; };
        ctrl.callbacks.onStateChange = (s) => {
          info.textContent = `帧${fmtFrame(ctrl.frameIndex)}/${ctrl.frameCount} | ${s}`;
        };
        enableUI();
        refreshSlider();
        resizeToAsset();
        lastTime = performance.now();
        if (asset.hitEffects && asset.hitEffects.shapes && asset.hitEffects.shapes.length > 0) {
          $('hitState').textContent = `素材包含 ${asset.hitEffects.shapes.length} 个击中特效形状，可点💥预览`;
        }
      } catch (err) {
        info.textContent = '加载失败: ' + err.message;
        console.error(err);
      }
    };

    // ★ 轻量纹理包加载（FTX3 多帧，无需 bundle）
    $('ftxFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (asset) { ctrl?.dispose(); asset.dispose(); disposeFtxQuad(ctx.scene); }
      try {
        asset = await FtxAsset.load(await file.arrayBuffer());
        const order = $('orderSelect').value;
        ctrl = asset.createController({ fps: 3, order: ORDER_MAP[order] || 'loop' });
        ctrl.callbacks.onFrameChange = (idx) => {
          frameSlider.value = fmtFrame(idx);
          frameNum.value = fmtFrame(idx);
          info.textContent = `帧${fmtFrame(idx)}/${ctrl.frameCount} | 第${ctrl.currentLoop+1}轮 | ${ctrl.localTime.toFixed(1)}s | ${ctrl.state}`;
        };
        ctrl.callbacks.onComplete = () => { info.textContent += ' [播放完毕]'; };
        ctrl.callbacks.onStateChange = (s) => {
          info.textContent = `帧${fmtFrame(ctrl.frameIndex)}/${ctrl.frameCount} | ${s}`;
        };
        enableUI();
        refreshSlider();
        resizeToAsset();
        lastTime = performance.now();
        info.textContent = `纹理包: ${asset.frameCount}帧 @ ${asset.width}×${asset.height}`;
      } catch (err) {
        info.textContent = '加载失败: ' + err.message;
        console.error(err);
      }
    };

    $('btnPlay').onclick = () => ctrl?.play();
    $('btnPause').onclick = () => ctrl?.pause();
    $('btnStop').onclick = () => ctrl?.stop();
    $('btnHold').onclick = () => {
      if (!ctrl) return;
      if (ctrl.isHolding) {
        ctrl.release();
        $('holdState').textContent = '';
        $('btnHold').textContent = '📌 冻结帧';
      } else {
        ctrl.hold();
        $('holdState').textContent = '已冻结';
        $('btnHold').textContent = '📌 解除冻结';
      }
      refreshSlider();
    };
    $('btnStepF').onclick = () => { ctrl?.stepForward(); refreshSlider(); };
    $('btnStepB').onclick = () => { ctrl?.stepBackward(); refreshSlider(); };
    $('btnGoto').onclick = () => {
      if (!ctrl) return;
      ctrl.goto(unfmtFrame(parseInt($('frameNum').value, 10)));
      refreshSlider();
    };

    frameSlider.oninput = () => {
      if (!ctrl) return;
      const n = parseInt(frameSlider.value, 10);
      ctrl.goto(unfmtFrame(n));
      frameNum.value = n;
    };
    frameNum.onchange = () => {
      if (!ctrl) return;
      ctrl.goto(unfmtFrame(parseInt(frameNum.value, 10)));
      refreshSlider();
    };
    $('orderSelect').onchange = () => {
      if (!ctrl) return;
      const val = $('orderSelect').value;
      ctrl.reset({ order: ORDER_MAP[val] || 'loop' });
    };
    $('speedInput').onchange = () => {
      if (!ctrl) return;
      ctrl.reset({ speed: parseFloat($('speedInput').value) || 1 });
    };

    // ★ 公共物理参数预设（.phys.json 内容，注入后作用到当前资产任意帧）
    const PHYS_PRESETS = {
      fire: {
        enableAdvection: true, enablePressure: true, pressureIterations: 12,
        advectionMode: 'vector', combineMode: 'add',
        channels: { r: true, g: true, b: true, a: true, h: true, s: true, l: true },
        scalarConfig: { hMultiplier: 0.4, sMultiplier: 0.6, lMultiplier: 0.9, aMultiplier: 0.3, baselineDensity: 0, decayRate: 0.1 },
        gravity: { x: 0, y: 120 }, velocityScale: 1.0, maxVelocity: 500,
        continuousSources: [{ enabled: true, position: { x: 0.5, y: 0.85 }, radius: 0.12, velocity: { x: 0, y: -180 }, color: [0.9, 0.35, 0.1], density: 0.9, rate: 0.9 }],
      },
      water: {
        enableAdvection: true, enablePressure: true, pressureIterations: 20,
        pressureBoundaryMode: 'neumann', enableWarmStart: true,
        advectionMode: 'vector', combineMode: 'sub',
        channels: { h: true, s: true, l: true },
        scalarConfig: { hMultiplier: 0.15, sMultiplier: 0.1, lMultiplier: 0.05, aMultiplier: 0.4, baselineDensity: 0.15, decayRate: 0.02 },
        gravity: { x: 0, y: 200 }, velocityScale: 0.9, maxVelocity: 400,
        continuousSources: [{ enabled: true, position: { x: 0.5, y: 0.15 }, radius: 0.1, velocity: { x: 0, y: 160 }, color: [0.15, 0.45, 0.8], density: 0.7, rate: 0.7 }],
      },
      poison: {
        enableAdvection: true, enablePressure: false, advectionMode: 'scalar',
        combineMode: 'sub', channels: { h: true, s: true, l: true, a: true },
        scalarConfig: { hMultiplier: 0.05, sMultiplier: 0.5, lMultiplier: 0.2, aMultiplier: 0.6, baselineDensity: 0.3, decayRate: 0.03 },
        velocityScale: 0.3, maxVelocity: 120,
        continuousSources: [{ enabled: true, position: { x: 0.5, y: 0.8 }, radius: 0.2, velocity: { x: 0, y: -30 }, color: [0.35, 0.8, 0.2], density: 0.5, rate: 0.5, wave: { enabled: true, amplitude: 0.05, frequency: 2, speed: 1.5 } }],
      },
    };
    function injectPhysics(key) {
      if (!asset || !ctrl) return;
      injectedPhysics = key ? PHYS_PRESETS[key] : null;
      if (asset instanceof FtxAsset) {
        asset.clearFluidEffect(ctrl.frameIndex);
      } else {
        asset.injectPhysics(ctrl.frameIndex, injectedPhysics);
      }
      $('physState').textContent = key ? `已注入: ${key}` : '无';
    }
    $('physFire').onclick = () => injectPhysics('fire');
    $('physWater').onclick = () => injectPhysics('water');
    $('physPoison').onclick = () => injectPhysics('poison');
    $('physNone').onclick = () => injectPhysics(null);

    // ========== ★ 击中特效预览（素材包 hit_effects.json） ==========
    let hitDefs = null;        // 解析后的特效形状列表
    let hitFtxImages = new Map(); // 形状名 → FTX 合成后的 RGB 图（CPU 合成一次）
    let hitStart = 0;
    let hitVariants = [];
    let hitTotal = 0;
    let hitPlaying = false;
    // ★ 击中特效在主窗口(#c)播放：离屏 2D 画帧 → 纹理 → WebGL 满屏 quad
    let hitCanvas2d = null;      // 离屏 2D 画布
    let hitTexture = null;       // 上传到 WebGL 的纹理
    let hitQuad = null;          // 满屏 quad（独立场景，不干扰帧渲染）
    let hitScene = null;

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function base64ToFloat(b64) { return new Float32Array(base64ToBytes(b64).buffer); }
    function hsl2rgb(h, s, l) {
      h = ((h % 1) + 1) % 1;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => { const k = (n + h * 12) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
      return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
    }
    /** FTX 嵌入（baseHsl + 量化残差）→ RGB 画布（CPU 合成一次，供预览绘制） */
    function buildFtxImage(ftx) {
      const hsl = base64ToFloat(ftx.baseHslBase64);
      const res = base64ToBytes(ftx.residualBase64);
      const w = ftx.width, h = ftx.height;
      const img = new ImageData(w, h);
      for (let i = 0; i < w * h; i++) {
        const o = i * 4;
        const baseA = hsl[o + 3];
        if (baseA < 0.5) continue;
        const dH = (res[o] / 255 * 2 - 1) * 0.5;
        const dS = (res[o + 1] / 255 * 2 - 1) * 0.5;
        const dL = (res[o + 2] / 255 * 2 - 1) * 0.5;
        const fh = (hsl[o] + dH + 1) % 1;
        const fs = Math.max(0, Math.min(1, hsl[o + 1] + dS));
        const fl = Math.max(0, Math.min(1, hsl[o + 2] + dL));
        const [r, g, b] = hsl2rgb(fh, fs, fl);
        img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').putImageData(img, 0, 0);
      return c;
    }
    /** 从素材包 hit_effects.json 准备预览 */
    function prepareHitPreview() {
      const raw = asset?.hitEffects;
      if (!raw || !raw.shapes || raw.shapes.length === 0) return false;
      hitDefs = raw.shapes;
      hitFtxImages.clear();
      for (const sh of hitDefs) {
        if (sh.ftx) hitFtxImages.set(sh.name, buildFtxImage(sh.ftx));
      }
      return true;
    }
    function startHitPreview() {
      if (!prepareHitPreview()) {
        $('hitState').textContent = '无击中特效定义';
        return;
      }
      // 构造生成器可消费的 def（outline + fill + params）
      const defs = hitDefs.map((sh, i) => ({
        id: i,
        name: sh.name,
        outline: sh.outline,
        fill: sh.solid ?? { h: 0.55, s: 0.8, l: 0.6, a: 1 },
        params: sh.params,
      }));
      const seed = randomSeed();
      hitVariants = defs.map((d, i) => generateVariant(d, shapeSeed(seed, i)));
      hitTotal = Math.max(...defs.map(variantDuration));
      hitStart = performance.now();
      // 离屏 2D 画布（与主画布同尺寸）
      hitCanvas2d = document.createElement('canvas');
      hitCanvas2d.width = canvas.width;
      hitCanvas2d.height = canvas.height;
      // WebGL 满屏 quad：独立场景，纹理每帧更新
      hitTexture = new THREE.Texture(hitCanvas2d);
      hitTexture.minFilter = THREE.LinearFilter;
      hitTexture.magFilter = THREE.LinearFilter;
      hitScene = new THREE.Scene();
      const hitMat = new THREE.ShaderMaterial({
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
        fragmentShader: 'uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor = texture2D(uTex, vec2(vUv.x, 1.0 - vUv.y)); }',
        uniforms: { uTex: { value: hitTexture } },
        depthTest: false,
      });
      hitQuad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), hitMat);
      hitQuad.position.set(0.5, 0.5, 0);
      hitQuad.frustumCulled = false;
      hitScene.add(hitQuad);
      hitPlaying = true;
      $('btnHitPreview').disabled = true;
      $('btnHitStop').disabled = false;
      $('hitState').textContent = `播放中（${hitDefs.length} 形状，${hitTotal.toFixed(2)}s）`;
    }
    function stopHitPreview() {
      hitPlaying = false;
      if (hitQuad) { hitScene?.remove(hitQuad); hitQuad.geometry.dispose(); hitQuad.material.dispose(); hitQuad = null; }
      if (hitTexture) { hitTexture.dispose(); hitTexture = null; }
      hitScene = null;
      hitCanvas2d = null;
      $('btnHitPreview').disabled = false;
      $('btnHitStop').disabled = true;
      $('hitState').textContent = '';
    }
    $('btnHitPreview').onclick = () => {
      try {
        startHitPreview();
      } catch (e) {
        $('hitState').textContent = '预览失败: ' + e.message;
        console.error('[hitEffect] 预览失败:', e);
      }
    };
    $('btnHitStop').onclick = () => {
      try { stopHitPreview(); } catch (e) { console.error(e); }
    };

    // ★ 调试视图切换：合成视图 ↔ 残差视图（验证残差是否存在于基础色=0 区域）
    function ensureResidScene() {
      if (residScene) return;
      residScene = new THREE.Scene();
      residQuad = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.ShaderMaterial({
          vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
          fragmentShader: 'uniform sampler2D uTex; varying vec2 vUv; void main(){ vec4 c = texture2D(uTex, vec2(vUv.x, 1.0 - vUv.y)); gl_FragColor = vec4(c.rgb, 1.0); }',
          uniforms: { uTex: { value: null } },
        }),
      );
      residQuad.position.set(0.5, 0.5, 0);
      residQuad.frustumCulled = false;
      residScene.add(residQuad);
    }
    $('btnResidView').onclick = () => {
      viewMode = 'residual';
      ensureResidScene();
      $('viewState').textContent = '残差视图（RGB=量化残差，验证基础色=0处是否有残差）';
    };
    $('btnCompositeView').onclick = () => {
      viewMode = 'composite';
      $('viewState').textContent = '';
    };

    /** 击中特效 2D 绘制（预览模式，叠加纯色/FTX纹理填充 + 外扩动画） */
    function drawHitPreview(t) {
      if (!hitCanvas2d) return;
      const c2d = hitCanvas2d.getContext('2d');
      const W = hitCanvas2d.width, H = hitCanvas2d.height;
      c2d.clearRect(0, 0, W, H);
      for (let i = 0; i < hitDefs.length; i++) {
        const sh = hitDefs[i];
        const v = hitVariants[i];
        const pose = tickVariant(v, t, {
          params: sh.params,
          outline: sh.outline,
          fill: sh.solid ?? { h: 0, s: 0, l: 0, a: 1 },
        });
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of v.vertices) {
          if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
        }
        const span = Math.max(1e-6, Math.max(maxX - minX, maxY - minY));
        const pad = 40;
        const s = (Math.min(W, H) - pad * 2) / span;
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        c2d.save();
        c2d.translate(W / 2, H / 2);
        c2d.rotate(pose.angle);
        c2d.scale(pose.scaleX, pose.scaleY);
        c2d.translate(-cx * s, -cy * s);
        c2d.beginPath();
        v.vertices.forEach((p, j) => {
          const px = p.x * s, py = p.y * s;
          if (j === 0) c2d.moveTo(px, py); else c2d.lineTo(px, py);
        });
        c2d.closePath();
        // 填充：FTX 帧纹理（clip 内）或纯色
        const ftxImg = hitFtxImages.get(sh.name);
        if (sh.fillMode === 'ftx' && ftxImg) {
          c2d.save();
          c2d.clip();
          c2d.imageSmoothingEnabled = false;
          c2d.drawImage(ftxImg, 0, 0, W, H);
          c2d.restore();
        } else if (sh.solid) {
          const [fr, fg, fb] = hsl2rgb(sh.solid.h, sh.solid.s, sh.solid.l);
          c2d.fillStyle = `rgba(${fr},${fg},${fb},${sh.solid.a ?? 1})`;
          c2d.fill();
        }
        // 外置残差层（可选，clip 内平铺）
        if (sh.residualLayer) {
          const rc = document.createElement('canvas');
          rc.width = sh.residualLayer.width;
          rc.height = sh.residualLayer.height;
          rc.getContext('2d').putImageData(new ImageData(
            new Uint8ClampedArray(base64ToBytes(sh.residualLayer.dataBase64)),
            sh.residualLayer.width, sh.residualLayer.height
          ), 0, 0);
          c2d.save();
          c2d.clip();
          c2d.imageSmoothingEnabled = false;
          c2d.drawImage(rc, 0, 0, W, H);
          c2d.restore();
        }
        c2d.strokeStyle = 'rgba(255,255,255,0.35)';
        c2d.lineWidth = 1;
        c2d.stroke();
        c2d.restore();
      }
    }

    function tick() {
      requestAnimationFrame(tick);
      if (hitPlaying) {
        const t = (performance.now() - hitStart) / 1000;
        drawHitPreview(t);
        if (hitTexture && hitQuad) {
          hitTexture.needsUpdate = true;
          ctx.renderer.clear(true, true, true);
          ctx.renderer.render(hitScene, ctx.camera);
        }
        if (t >= hitTotal) stopHitPreview();
        return;
      }
      if (!asset || !ctrl) return;

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // 动画时钟：永远推进，不受帧暂停/跳转影响
      animTime += dt;

      // 帧切换：由 Controller 控制，可暂停/跳帧
      ctrl.advance(dt);

      // ★ 残差视图：显示 colorGrid 原始残差纹理（验证基础色=0 处是否有残差）
      if (viewMode === 'residual') {
        let residualTex = null;
        if (asset instanceof FtxAsset) {
          // 纹理包需要注入物理参数才有流体解算器
          if (injectedPhysics) {
            const eff = asset.getFluidEffect(ctrl.frameIndex, ctx.renderer, injectedPhysics);
            if (eff) {
              eff.step(dt);
              residualTex = eff.getResidualTexture();
            }
          }
        } else if (asset.hasPhysics(ctrl.frameIndex)) {
          const eff = asset.getFluidEffect(ctrl.frameIndex, ctx.renderer);
          if (eff) {
            eff.step(dt);
            residualTex = eff.getResidualTexture();
          }
        }
        if (residQuad && residualTex) {
          residQuad.material.uniforms.uTex.value = residualTex;
          ctx.renderer.clear(true, true, true);
          ctx.renderer.render(residScene, ctx.camera);
        } else {
          ctx.renderer.clear(true, true, true);
          ctx.renderer.render(ctx.scene, ctx.camera);
        }
        return;
      }

      // ★ 轻量纹理包：直接合成渲染（无实体/流体），支持注入公共物理参数
      if (asset instanceof FtxAsset) {
        let fluidTex = null;
        if (injectedPhysics) {
          const eff = asset.getFluidEffect(ctrl.frameIndex, ctx.renderer, injectedPhysics);
          if (eff) {
            eff.step(dt);
            fluidTex = eff.getCompositeTexture();
          }
        }
        renderFtxFrame(asset, ctrl.frameIndex, ctx.renderer, ctx.scene, ctx.camera, fluidTex);
        return;
      }

      const data = asset.getFrameRenderData(ctrl.frameIndex);
      if (data) {
        // ★ 流体：持续解算（与播放/暂停无关，暂停只控制帧切换）
        //   仅当前帧有流体配置时驱动解算器；换帧后旧帧效果自动停止推进
        let fluidTex = null;
        let fluidEff = null;
        if (asset.hasPhysics(ctrl.frameIndex)) {
          fluidEff = asset.getFluidEffect(ctrl.frameIndex, ctx.renderer);
          if (fluidEff) {
            fluidEff.step(dt);
            fluidTex = fluidEff.getCompositeTexture();
          }
        }
        renderFrameData(data, animTime, 30, STYLE, ctx.renderer, ctx.scene, ctx.camera, fluidTex);
        // ★ 手动注入交互：按住画面 → 转 bbox 局部 UV → 持续注入（节流 ~10Hz）
        if (fluidEff && pendingInject && pendingInject.active && pendingInject.frame === ctrl.frameIndex) {
          injectTick++;
          if (injectTick >= 3) {
            injectTick = 0;
            const hit = data.entities[0];
            if (hit) {
              const fw = hit.frameWidth;
              const bbox = hit.texBbox;
              const cx = pendingInject.x / canvas.width;   // 归一化画布坐标 (0~1)
              const cy = pendingInject.y / canvas.height;
              // 与 shader 一致：vUv = [x, 1-y] → bbox 局部 UV
              const uv = {
                x: (cx - bbox.x / fw) / (bbox.w / fw),
                y: (cy - bbox.y / fw) / (bbox.h / fw),
              };
              if (uv.x >= 0 && uv.x <= 1 && uv.y >= 0 && uv.y <= 1) {
                fluidEff.injectAt(uv);
              }
            }
          }
        }
      }
    }
    tick();

    // ★ 手动注入：按住画面持续注入（pointer 事件，兼容鼠标/触屏）
    function injectPosFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height),
      };
    }
    canvas.addEventListener('pointerdown', (e) => {
      if (!asset || !ctrl) return;
      if (!asset.hasPhysics(ctrl.frameIndex)) return;
      canvas.setPointerCapture?.(e.pointerId);
      const p = injectPosFromEvent(e);
      pendingInject = { frame: ctrl.frameIndex, x: p.x, y: p.y, active: true };
      injectTick = 0;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!pendingInject || !pendingInject.active) return;
      const p = injectPosFromEvent(e);
      pendingInject.x = p.x;
      pendingInject.y = p.y;
    });
    const endInject = () => { if (pendingInject) pendingInject.active = false; };
    canvas.addEventListener('pointerup', endInject);
    canvas.addEventListener('pointercancel', endInject);
    canvas.addEventListener('pointerleave', endInject);
  </script>
</body>
</html>
